tRange(r, 4).setNumberFormat('0'); sh.getRange(r, 6).setNumberFormat('0');\n    rg.setValues([vals]);\n    return { ok: true };\n  } finally { lock.releaseLock(); }\n}\n\nfunction sheet_() {\n  var ss = SpreadsheetApp.getActiveSpreadsheet(), sh = ss.getSheetByName('responses');\n  if (ss.getSpreadsheetTimeZone && ss.getSpreadsheetTimeZone() !== TZ) ss.setSpreadsheetTimeZone(TZ);\n  if (!sh) {\n    sh = ss.insertSheet('responses');\n    sh.getRange(1, 1, 1, RESP_HEAD.length).setValues([RESP_HEAD]);\n    sh.getRange('A:C').setNumberFormat('@'); sh.getRange('E:E').setNumberFormat('@'); sh.getRange('G:T').setNumberFormat('@');\n    sh.setFrozenRows(1);\n    var def = ss.getSheetByName('シート1') || ss.getSheetByName('Sheet1'); if (def && ss.getSheets().length > 1) ss.deleteSheet(def);\n  }\n  if (String(sh.getRange(1, RESP_HEAD.length).getValue()) !== RESP_HEAD[RESP_HEAD.length - 1]) sh.getRange(1, RESP_HEAD.length).setValue(RESP_HEAD[RESP_HEAD.length - 1]); // 後から足した列の見出し\n  return sh;\n}\n", ADMIN = "// 反響事例管理 — 管理サイト（社内のみ）\n// デプロイ: ウェブアプリ / 実行ユーザー=自分 / アクセス=ドメイン内のユーザー\n// 全員が全部見られる。担当の情報（ジャンル・掲載号・媒体・サイズ・料金）を入れる／直す／消すのは担当本人と管理者\n\nvar TZ = 'Asia/Tokyo';\nvar SHEET_ID = '1w-4FIkRfEjiCEo6LwKKb8CoXMOvT7_c6ASFpVkrO3ks'; // 反響事例管理データ（フォームの受け口 gas-api の親）\nvar QR_SHEET_ID = '1riYm2WOMEeZBq0Te6BsqBumQFvPji9oYuZa8c6_So0o'; // 名前はQR管理の members（社内スタッフ名簿から流し込み済み）を借りる\nvar ADMIN_EMAIL = 'hirayama@k-create.co.jp';\n// responses シートの列（gas-api と同じ並び）\nvar RESP_HEAD = ['id', 'at', 'keisai', 'sat_hankyo', 'hankyo', 'sat_cost', 'riyu', 'youbou',\n  'owner_email', 'owner_name', 'claimed_at', 'genre', 'month', 'media', 'size', 'price', 'memo', 'updated', 'deleted', 'deleted_by', 'via'];\n// via（21列目・2026-11-19〜）= 担当者専用フォームから来た回答の印（gas-api と同じ）\n// 担当者専用フォーム（2026-11-19〜）: 1人1つ。URL は FORM_URL?t=<token>。参考文（②④⑤のグレーの例文）を人ごとに変えられる\nvar FORMS_HEAD = ['token', 'email', 'name', 'ph_hankyo', 'ph_riyu', 'ph_youbou', 'created', 'updated'];\nvar DEFAULT_PH = { hankyo: '10件の応募があった・5件の新規獲得ができた・売上が上がった・来店が増えたなど', riyu: '費用対効果満足度が得られた・反響はあったが費用的には高く感じたなど', youbou: '次回も掲載したい・エリアを広げていきたい・HPやAIについても相談したいなど' };\nvar TOKEN_CHARS = 'abcdefghjkmnpqrstuvwxyz23456789';\nvar MASTERS = {\n  genres: ['グルメ', 'スクール', 'ショップ', '暮らし', 'トータルケア', 'クリニック', '介護・福祉', '終活・士業', '企業', 'その他'],\n  media: ['一宮', '江南', '岩倉', '清須', '津島', '西北'],\n  sizes: ['表4', '表2・表3', '表2・3対向', '2P', '1P', '1/2P AD', '1/2P FO', '1/4P AD', '1/4P FO', '1/3P FO', '1/6P FO', '1/8P FO', '1P 求人', '1/2P 求人', '3/5P', '2/5P', '1/5P', '2/15P', '1/15P', 'その他企画枠'] // オーナー指定の並び（2026-11-18・その他企画枠は 2026-11-19 追加）\n};\nvar FORM_URL = 'https://hirayama-byte.github.io/kcreate-hankyo/'; // settings の form_url で上書き可\n\nfunction doGet() {\n  return HtmlService.createTemplateFromFile('index').evaluate()\n    .setTitle('反響事例管理')\n    .addMetaTag('viewport', 'width=device-width, initial-scale=1');\n}\n\n// ---------- シート ----------\nvar memo_ = {};\nfunction ss_() { return memo_.ss || (memo_.ss = SpreadsheetApp.openById(SHEET_ID)); }\nfunction ensureSheet_(name, head) {\n  var ss = ss_(), sh = ss.getSheetByName(name);\n  if (!sh) { sh = ss.insertSheet(name); sh.getRange(1, 1, 1, head.length).setValues([head]); sh.setFrozenRows(1); }\n  return sh;\n}\nfunction respSheet_() {\n  var sh = ss_().getSheetByName('responses');\n  if (!sh) {\n    sh = ensureSheet_('responses', RESP_HEAD);\n    sh.getRange('A:C').setNumberFormat('@'); sh.getRange('E:E').setNumberFormat('@'); sh.getRange('G:U').setNumberFormat('@');\n  }\n  if (String(sh.getRange(1, RESP_HEAD.length).getValue()) !== 'via') sh.getRange(1, RESP_HEAD.length).setValue('via'); // 後から足した列の見出し\n  return sh;\n}\nfunction setup_() {\n  respSheet_();\n  Object.keys(MASTERS).forEach(function (k) {\n    var sh = ensureSheet_(k, [k]);\n    if (sh.getLastRow() < 2) sh.getRange(2, 1, MASTERS[k].length, 1).setValues(MASTERS[k].map(function (v) { return [v]; }));\n    sh.getRange('A:A').setNumberFormat('@');\n  });\n  var ad = ensureSheet_('admins', ['email']); if (ad.getLastRow() < 2) ad.appendRow([ADMIN_EMAIL]);\n  ensureSheet_('settings', ['key', 'value']);\n  var def = ss_().getSheetByName('シート1') || ss_().getSheetByName('Sheet1'); if (def && ss_().getSheets().length > 1) ss_().deleteSheet(def);\n}\nfunction col_(name) { var sh = ss_().getSheetByName(name); if (!sh || sh.getLastRow() < 2) return []; return sh.getRange(2, 1, sh.getLastRow() - 1, 1).getValues().map(function (r) { return String(r[0]).trim(); }).filter(String); }\nfunction setting_(key) { var sh = ss_().getSheetByName('settings'); if (!sh || sh.getLastRow() < 2) return ''; var v = sh.getRange(2, 1, sh.getLastRow() - 1, 2).getValues(); for (var i = 0; i < v.length; i++) if (String(v[i][0]) === key) return String(v[i][1]); return ''; }\n\n// ---------- 人 ----------\nfunction myEmail_() { return String(Session.getActiveUser().getEmail() || '').toLowerCase(); }\nfunction isAdmin_(email) { return col_('admins').some(function (e) { return e.toLowerCase() === email; }); }\nfunction names_() {\n  if (memo_.names) return memo_.names;\n  var m = {};\n  try {\n    var sh = SpreadsheetApp.openById(QR_SHEET_ID).getSheetByName('members');\n    if (sh && sh.getLastRow() > 1) sh.getRange(2, 1, sh.getLastRow() - 1, 2).getValues().forEach(function (r) { if (r[0] && r[1]) m[String(r[0]).toLowerCase()] = String(r[1]); });\n  } catch (x) { console.error('名前を読めません: ' + x); }\n  return (memo_.names = m);\n}\nfunction nameOf_(email) { return names_()[email] || String(email).split('@')[0]; }\n\n// ---------- 回答 ----------\nfunction str_(v) { return v instanceof Date ? Utilities.formatDate(v, TZ, 'yyyy-MM-dd HH:mm') : String(v == null ? '' : v); }\nfunction month_(v) { return v instanceof Date ? Utilities.formatDate(v, TZ, 'yyyy-MM') : String(v == null ? '' : v); }\nfunction rowObj_(r) {\n  var o = {}; RESP_HEAD.forEach(function (k, i) { o[k] = r[i]; });\n  return {\n    id: str_(o.id), at: str_(o.at), keisai: str_(o.keisai).replace(/^'/, ''), satHankyo: Number(o.sat_hankyo) || 0, hankyo: str_(o.hankyo).replace(/^'/, ''),\n    satCost: Number(o.sat_cost) || 0, riyu: str_(o.riyu).replace(/^'/, ''), youbou: str_(o.youbou).replace(/^'/, ''),\n    ownerEmail: str_(o.owner_email).toLowerCase(), ownerName: str_(o.owner_name), claimedAt: str_(o.claimed_at),\n    genre: str_(o.genre), month: month_(o.month), media: str_(o.media), size: str_(o.size),\n    price: o.price === '' || o.price == null ? '' : Number(String(o.price).replace(/[^\\d.]/g, '')) || 0, memo: str_(o.memo),\n    updated: str_(o.updated), deleted: str_(o.deleted), deletedBy: str_(o.deleted_by), via: str_(o.via)\n  };\n}\nfunction allRows_() {\n  var sh = respSheet_(), n = sh.getLastRow();\n  if (n < 2) return [];\n  return sh.getRange(2, 1, n - 1, RESP_HEAD.length).getValues().map(rowObj_).filter(function (o) { return o.id; });\n}\nfunction findRow_(id) {\n  id = String(id || '');\n  if (!/^R\\d{12,}$/.test(id)) throw new Error('回答のIDが正しくありません');\n  var sh = respSheet_(), hit = sh.getRange('A:A').createTextFinder(id).matchEntireCell(true).findNext();\n  if (!hit || hit.getRow() < 2) throw new Error('この回答は見つかりません（ほかの人が消したかもしれません）');\n  return { sh: sh, row: hit.getRow(), obj: rowObj_(sh.getRange(hit.getRow(), 1, 1, RESP_HEAD.length).getValues()[0]) };\n}\nfunction setCols_(f, kv) {\n  Object.keys(kv).forEach(function (k) { var c = RESP_HEAD.indexOf(k); if (c >= 0) f.sh.getRange(f.row, c + 1).setValue(kv[k]); });\n}\nfunction now_() { return Utilities.formatDate(new Date(), TZ, 'yyyy-MM-dd HH:mm'); }\nfunction withLock_(fn) { var l = LockService.getScriptLock(); l.waitLock(20000); try { return fn(); } finally { l.releaseLock(); } }\nfunction canEdit_(o, me) { return o.ownerEmail === me || isAdmin_(me); }\n\n// ---------- 画面から呼ぶ ----------\nfunction init() {\n  var me = myEmail_();\n  if (!me) throw new Error('会社のGoogleアカウントで開いてください');\n  if (!ss_().getSheetByName('admins')) setup_();\n  if (ss_().getSpreadsheetTimeZone() !== TZ) ss_().setSpreadsheetTimeZone(TZ); // 作ったときの初期値が日本時間でないことがある（2026-11-18 9時間ずれ）\n  var admin = isAdmin_(me);\n  var rows = allRows_().filter(function (o) { return admin || !o.deleted; });\n  return {\n    me: { email: me, name: nameOf_(me), isAdmin: admin },\n    masters: { genres: col_('genres'), media: col_('media'), sizes: col_('sizes') },\n    formUrl: setting_('form_url') || FORM_URL,\n    myForm: myForm_(me),\n    defaultPh: DEFAULT_PH,\n    people: people_(),\n    sheetUrl: admin ? ss_().getUrl() : '',\n    rows: rows\n  };\n}\nfunction listRows() { var me = myEmail_(), admin = isAdmin_(me); return allRows_().filter(function (o) { return admin || !o.deleted; }); }\n\n// 自分の担当にする（まだ担当がいない回答だけ。管理者は付け替えもできる）\nfunction claim(id, toEmail) {\n  var me = myEmail_();\n  return withLock_(function () {\n    var f = findRow_(id);\n    if (f.obj.deleted) throw new Error('削除された回答です');\n    var who = me;\n    if (toEmail && isAdmin_(me)) who = String(toEmail).toLowerCase();\n    else if (f.obj.ownerEmail && f.obj.ownerEmail !== me) throw new Error('すでに ' + f.obj.ownerName + ' さんの担当です');\n    setCols_(f, { owner_email: who, owner_name: nameOf_(who), claimed_at: now_(), updated: now_() });\n    return rowObj_(f.sh.getRange(f.row, 1, 1, RESP_HEAD.length).getValues()[0]);\n  });\n}\n// 担当を付け替える（QR管理と同じ・担当本人と管理者）。相手は社内の名簿にいる人だけ\nfunction assign(id, toEmail) {\n  var me = myEmail_(), to = String(toEmail || '').trim().toLowerCase();\n  if (!to || !names_()[to]) throw new Error('担当にする人を選んでください（社内の名簿にいる人だけ）');\n  return withLock_(function () {\n    var f = findRow_(id);\n    if (f.obj.deleted) throw new Error('削除された回答です');\n    if (f.obj.ownerEmail && !canEdit_(f.obj, me)) throw new Error('担当の ' + f.obj.ownerName + ' さんか管理者だけが付け替えられます');\n    if (!f.obj.ownerEmail && to !== me && !isAdmin_(me)) throw new Error('担当がいない回答をほかの人に付けられるのは管理者だけです');\n    setCols_(f, { owner_email: to, owner_name: nameOf_(to), claimed_at: now_(), updated: now_() });\n    return rowObj_(f.sh.getRange(f.row, 1, 1, RESP_HEAD.length).getValues()[0]);\n  });\n}\n// 名簿（担当の付け替えで選ぶ人）\nfunction people_() { var m = names_(); return Object.keys(m).map(function (e) { return { email: e, name: m[e] }; }).sort(function (a, b) { return a.name < b.name ? -1 : 1; }); }\n// ---------- 担当者専用フォーム ----------\nfunction formsSheet_() { var sh = ensureSheet_('forms', FORMS_HEAD); return sh; }\nfunction myForm_(email) {\n  var sh = formsSheet_(), n = sh.getLastRow(), v = n > 1 ? sh.getRange(2, 1, n - 1, FORMS_HEAD.length).getValues() : [];\n  for (var i = 0; i < v.length; i++) if (String(v[i][1]).toLowerCase() === email) return { token: String(v[i][0]), url: (setting_('form_url') || FORM_URL) + '?t=' + v[i][0], ph: { hankyo: String(v[i][3] || ''), riyu: String(v[i][4] || ''), youbou: String(v[i][5] || '') } };\n  return null;\n}\n// 自分専用フォームを作る（まだなければ）\nfunction createMyForm() {\n  var me = myEmail_(); if (!me) throw new Error('会社のGoogleアカウントで開いてください');\n  return withLock_(function () {\n    var cur = myForm_(me); if (cur) return cur;\n    var sh = formsSheet_(), used = {}; if (sh.getLastRow() > 1) sh.getRange(2, 1, sh.getLastRow() - 1, 1).getValues().forEach(function (r) { used[String(r[0])] = 1; });\n    var t; do { t = ''; for (var i = 0; i < 8; i++) t += TOKEN_CHARS.charAt(Math.floor(Math.random() * TOKEN_CHARS.length)); } while (used[t]);\n    var r = sh.getLastRow() + 1; sh.getRange(r, 1, 1, FORMS_HEAD.length).setNumberFormat('@').setValues([[t, me, nameOf_(me), '', '', '', now_(), now_()]]);\n    return myForm_(me);\n  });\n}\n// 自分専用フォームの参考文を変える（空にすると共通の参考文）\nfunction saveMyForm(ph) {\n  var me = myEmail_(); ph = ph || {};\n  var c = function (v) { var x = String(v == null ? '' : v).replace(/\\r?\\n/g, ' ').trim().slice(0, 200); return /^[=+\\-@]/.test(x) ? \"'\" + x : x; };\n  return withLock_(function () {\n    if (!myForm_(me)) throw new Error('先に自分専用フォームを作ってください');\n    var sh = formsSheet_(), v = sh.getRange(2, 1, sh.getLastRow() - 1, 2).getValues();\n    for (var i = 0; i < v.length; i++) if (String(v[i][1]).toLowerCase() === me) { sh.getRange(i + 2, 3, 1, 4).setValues([[nameOf_(me), c(ph.hankyo), c(ph.riyu), c(ph.youbou)]]); sh.getRange(i + 2, 8).setValue(now_()); break; }\n    return myForm_(me);\n  });\n}\n// 担当をはずす（本人か管理者）\nfunction release(id) {\n  var me = myEmail_();\n  return withLock_(function () {\n    var f = findRow_(id);\n    if (!canEdit_(f.obj, me)) throw new Error('担当の人か管理者だけができます');\n    setCols_(f, { owner_email: '', owner_name: '', claimed_at: '', updated: now_() });\n    return rowObj_(f.sh.getRange(f.row, 1, 1, RESP_HEAD.length).getValues()[0]);\n  });\n}\n// 担当の情報を入れる／直す。担当がいなければ入れた人が担当になる\nfunction saveSales(id, d) {\n  var me = myEmail_();\n  d = d || {};\n  var clean = function (v, n) { var s = String(v == null ? '' : v).trim().slice(0, n); return /^[=+\\-@]/.test(s) ? \"'\" + s : s; };\n  var month = String(d.month || '').trim();\n  if (month && !/^\\d{4}-(0[1-9]|1[0-2])$/.test(month)) throw new Error('掲載号の形が正しくありません');\n  var price = String(d.price == null ? '' : d.price).replace(/[,，円\\s]/g, '');\n  if (price && !/^\\d{1,9}$/.test(price)) throw new Error('掲載料金は数字で入れてください（税抜・円）');\n  return withLock_(function () {\n    var f = findRow_(id);\n    if (f.obj.deleted) throw new Error('削除された回答です');\n    var kv = { genre: clean(d.genre, 40), month: month, media: clean(d.media, 40), size: clean(d.size, 40), price: price, memo: clean(d.memo, 1000), updated: now_() };\n    if (!f.obj.ownerEmail) { kv.owner_email = me; kv.owner_name = nameOf_(me); kv.claimed_at = now_(); }\n    else if (!canEdit_(f.obj, me)) throw new Error('担当の ' + f.obj.ownerName + ' さんか管理者だけが直せます');\n    setCols_(f, kv);\n    return rowObj_(f.sh.getRange(f.row, 1, 1, RESP_HEAD.length).getValues()[0]);\n  });\n}\n// 一覧の表・詳細ページで1項目だけ直す（その場で保存・2026-11-19）。ほかの項目は触らないので、続けて直しても上書きし合わない\n// 担当がいなければ直した人が担当になる（saveSales と同じ）\nfunction saveField(id, key, value) {\n  var me = myEmail_(), lim = { genre: 40, media: 40, size: 40, memo: 1000, month: 0, price: 0 };\n  if (!(key in lim)) throw new Error('直せない項目です');\n  var v = String(value == null ? '' : value).trim();\n  if (key === 'month' && v && !/^\\d{4}-(0[1-9]|1[0-2])$/.test(v)) throw new Error('掲載号の形が正しくありません');\n  if (key === 'price') { v = v.replace(/[,，円\\s]/g, ''); if (v && !/^\\d{1,9}$/.test(v)) throw new Error('掲載料金は数字で入れてください（税抜・円）'); }\n  if (lim[key]) { v = v.slice(0, lim[key]); if (/^[=+\\-@]/.test(v)) v = \"'\" + v; }\n  return withLock_(function () {\n    var f = findRow_(id);\n    if (f.obj.deleted) throw new Error('削除された回答です');\n    var kv = { updated: now_() }; kv[key] = v;\n    if (!f.obj.ownerEmail) { kv.owner_email = me; kv.owner_name = nameOf_(me); kv.claimed_at = now_(); }\n    else if (!canEdit_(f.obj, me)) throw new Error('担当の ' + f.obj.ownerName + ' さんか管理者だけが直せます');\n    setCols_(f, kv);\n    return rowObj_(f.sh.getRange(f.row, 1, 1, RESP_HEAD.length).getValues()[0]);\n  });\n}\n// 削除（ゴミ箱。管理者が戻せる）／戻す（管理者）\nfunction removeRow(id) {\n  var me = myEmail_();\n  return withLock_(function () {\n    var f = findRow_(id);\n    if (!canEdit_(f.obj, me)) throw new Error('担当の人か管理者だけが削除できます');\n    setCols_(f, { deleted: now_(), deleted_by: me });\n    return { ok: true };\n  });\n}\nfunction restoreRow(id) {\n  var me = myEmail_(); if (!isAdmin_(me)) throw new Error('管理者だけができます');\n  return withLock_(function () { var f = findRow_(id); setCols_(f, { deleted: '', deleted_by: '', updated: now_() }); return rowObj_(f.sh.getRange(f.row, 1, 1, RESP_HEAD.length).getValues()[0]); });\n}\n// 候補（ジャンル・媒体・サイズ）を直す（管理者）\nfunction saveMaster(kind, list) {\n  var me = myEmail_(); if (!isAdmin_(me)) throw new Error('管理者だけができます');\n  if (!MASTERS[kind]) throw new Error('不明な候補です');\n  var vals = (list || []).map(function (s) { return String(s).trim().slice(0, 40); }).filter(String);\n  var seen = {}; vals = vals.filter(function (v) { if (seen[v]) return false; seen[v] = 1; return true; });\n  if (!vals.length) throw new Error('1つ以上入れてください');\n  return withLock_(function () {\n    var sh = ensureSheet_(kind, [kind]);\n    if (sh.getLastRow() > 1) sh.getRange(2, 1, sh.getLastRow() - 1, 1).clearContent();\n    sh.getRange(2, 1, vals.length, 1).setNumberFormat('@').setValues(vals.map(function (v) { return [v]; }));\n    return vals;\n  });\n}\n\n// ---------- 情報読込（管理表から担当の情報を入れる・2026-11-25） ----------\n// 「情報読込」ボタンを押したときだけ動く。会社の管理表（Google ドライブ）を読むだけで、管理表には一切書き込まない。\n// 対象: 削除されていない回答のうち、ジャンル・掲載号・媒体・サイズ・料金が「全部」空のものだけ（1つでも入っていれば触らない）。\n// 比べ方: 回答の掲載名と、管理表の客先（掲載店）の全体、または「_」で区切った部分が同じなら当たり（部分一致はしない）。\n// 号: 回答日の月と同じか、それより前で、いちばん新しい号（回答日より後の号は使わない）。\n// 担当は空のときだけ、管理表の担当者（苗字）から名簿の人を探して入れる（1人に決まらなければ空のまま）。\n//\n// ■ 来年度の管理表を足すには\n//   管理表のフォルダ（例: ケイ・クリエイト管理表 / 41期管理表）を開き、URL の最後の英数字（フォルダID）を\n//   下の KANRI_FOLDERS に1行足して反映する。\n//   （または反響事例管理データの settings シートに key=kanri_folders、value=フォルダID（複数はカンマ区切り）を入れると、そちらが優先されます）\n//   フォルダの中の「管理表_〇〇版_2026年度」の形の名前のスプレッドシートを自動で探し、号のタブ（26.11月号 など）も自動で見つけます。\nvar KANRI_FOLDERS = [\n  '1P0O2GILxD9TaSEEDehaXK5zwRu8H_KUs' // 40期管理表（2026年度）\n];\nvar KANRI_FILE_RE = /管理表_(.+?版)_(\\d{4})年度/;\nvar KANRI_TAB_RE = /^\\s*(\\d{2})\\s*[.．]\\s*(\\d{1,2})\\s*月号\\s*$/;\nvar KANRI_LOOKBACK = 18; // 回答日の月から何か月前の号まで探すか（その月を含む）\nvar KANRI_TIME_LIMIT = 270000; // 管理表を読むのに4分半を超えたら、何も入れずに止める（Apps Script は6分で止まるため）\n\n// 名前の比べ方: 全角半角・大文字小文字をそろえ、空白・記号・会社の種類（株式会社など）を取る\nfunction kanriNorm_(s) {\n  var t = String(s == null ? '' : s).normalize('NFKC').toLowerCase();\n  t = t.replace(/株式会社|有限会社|合同会社|合資会社|合名会社|一般社団法人|一般財団法人|社会福祉法人|医療法人社団|医療法人|\\(株\\)|\\(有\\)|\\(同\\)/g, '');\n  return t.replace(/[\\s・ー‐\\-－―─~〜「」『』()（）\\[\\]【】〈〉《》<>、。,.，．'\"’”&＆!！?？\\/／:：;；+＋*＊#＃]/g, '');\n}\n// 客先（掲載店）の名前の候補: 全体と「_」で区切った各部分（例: 甲羅本店_サカエ商事 → 甲羅本店／サカエ商事）\nfunction kanriKeys_(customer) {\n  var raw = String(customer || '').normalize('NFKC'), out = [];\n  var add = function (x) { var k = kanriNorm_(x); if (k && out.indexOf(k) < 0) out.push(k); };\n  add(raw); raw.split('_').forEach(add);\n  return out;\n}\n// タブ名 26.11月号 → 2026-11（アプリの掲載号の形。画面では 2026年11月号 と出る）\nfunction kanriTabMonth_(name) {\n  var m = KANRI_TAB_RE.exec(String(name || '').normalize('NFKC'));\n  if (!m || +m[2] < 1 || +m[2] > 12) return '';\n  return '20' + m[1] + '-' + ('0' + m[2]).slice(-2);\n}\nfunction kanriAddMonths_(ym, n) { var y = +ym.slice(0, 4), m = +ym.slice(5, 7) - 1 + n; y += Math.floor(m / 12); m = ((m % 12) + 12) % 12; return y + '-' + ('0' + (m + 1)).slice(-2); }\n// サイズ＋フリー/定型 → アプリのサイズ（1/2＋フリー → 1/2P AD、1/4＋定型 → 1/4P FO、1 → 1P）。候補になければ ''\nfunction kanriSize_(size, type, sizes) {\n  var s = String(size || '').normalize('NFKC').replace(/\\s/g, '').replace(/(p|ページ)$/i, '');\n  if (!s) return '';\n  var base = s + 'P', t = String(type || '').normalize('NFKC'), sfx = /フリー/.test(t) ? 'AD' : /定型/.test(t) ? 'FO' : '';\n  if (sfx && sizes.indexOf(base + ' ' + sfx) >= 0) return base + ' ' + sfx;\n  if (sizes.indexOf(base) >= 0) return base; // 1P・2P・3/5P など、AD/FO の区別がないもの\n  return '';\n}\n// 見出しの行から列を探す（見つからなければ決まった位置: A担当者 B掲載ジャンル D客先 E サイズ F フリー/定型 H 掲載料）\n// 実物の見出し（2026-11-25 確認）: 担当者 / 掲載ジャンル / 掲載場所 / 客先（掲載店） / サイズ / フリー定型 / 制作料 / 掲載料 …\nfunction kanriCols_(head) {\n  var h = head.map(function (v) { return String(v || '').normalize('NFKC').replace(/\\s/g, ''); });\n  var find = function (re, def) { for (var i = 0; i < h.length; i++) if (re.test(h[i])) return i; return def; };\n  return { owner: find(/担当/, 0), genre: find(/ジャンル/, 1), customer: find(/客先|掲載店/, 3), size: find(/サイズ/, 4), type: find(/フリー|定型/, 5), price: find(/掲載料|金額/, 7) };\n}\n// 1つのタブを読む（表示どおりの文字で読む＝1/2 が日付に化けない）\nfunction kanriReadTab_(sh) {\n  var v = sh.getDataRange().getDisplayValues(), hr = -1;\n  for (var i = 0; i < Math.min(v.length, 5); i++) if (v[i].some(function (x) { return /客先|掲載店/.test(String(x)); })) { hr = i; break; }\n  if (hr < 0) hr = 0; // 見出しが見つからなくても1行目は見出しとみなす\n  var c = kanriCols_(v[hr] || []), out = [];\n  for (var r = hr + 1; r < v.length; r++) {\n    var row = v[r], cust = String(row[c.customer] || '').trim();\n    if (!cust) continue;\n    var p = String(row[c.price] || '').normalize('NFKC').replace(/[^\\d.]/g, '');\n    out.push({ owner: String(row[c.owner] || '').trim(), genre: String(row[c.genre] || '').normalize('NFKC').trim(), customer: cust, keys: kanriKeys_(cust),\n      size: String(row[c.size] || '').trim(), type: String(row[c.type] || '').trim(), price: p === '' || isNaN(Number(p)) ? null : Math.round(Number(p)) });\n  }\n  return out;\n}\n// 管理表のファイル一覧（版の名前・ID）。来年度分はフォルダIDを足すだけ\nfunction kanriFiles_() {\n  var ids = (setting_('kanri_folders') || '').split(/[,\\s]+/).filter(String);\n  if (!ids.length) ids = KANRI_FOLDERS;\n  var files = [], warn = [];\n  ids.forEach(function (fid) {\n    try {\n      var it = DriveApp.getFolderById(fid).getFiles();\n      while (it.hasNext()) {\n        var f = it.next(), m = KANRI_FILE_RE.exec(String(f.getName()).normalize('NFKC'));\n        if (m && f.getMimeType() === 'application/vnd.google-apps.spreadsheet') // Excel などの写しは読まない\n          files.push({ id: f.getId(), name: f.getName(), edition: m[1], year: +m[2] });\n      }\n    } catch (x) { warn.push('管理表のフォルダを開けませんでした（' + fid + '）'); }\n  });\n  files.sort(function (a, b) { return b.year - a.year; }); // 同じ版・同じ号が2つのファイルにあるときは新しい年度のほうを使う\n  return { files: files, warn: warn };\n}\n\n// 画面の「情報読込」ボタンから呼ぶ。ログインしている人ならだれでも押せる（空の項目を埋めるだけなので）\nfunction loadFromKanri() {\n  var me = myEmail_(); if (!me) throw new Error('会社のGoogleアカウントで開いてください');\n  if (!ss_().getSheetByName('admins')) setup_(); // 候補（ジャンル・媒体・サイズ）のシートがまだないとき\n  var t0 = Date.now();\n  var masters = { genres: col_('genres'), media: col_('media'), sizes: col_('sizes') };\n  var empty = function (o) { return !o.genre && !o.month && !o.media && !o.size && (o.price === '' || o.price == null); };\n  var targets = allRows_().filter(function (o) { return !o.deleted && empty(o); });\n  var res = { targets: targets.length, filled: [], partial: [], notFound: [], warn: [], read: { editions: [], tabs: 0 }, stopped: false };\n  if (!targets.length) return res;\n\n  // 読む号の範囲: いちばん古い回答の月の KANRI_LOOKBACK か月前 〜 いちばん新しい回答の月\n  var ams = targets.map(function (o) {   if (res.partial.length) h += '<h4>一部の項目が入らなかった回答 <span class="n">' + res.partial.length + '件</span></h4><div class="hint" style="margin-bottom:6px">入らなかった項目は、お手数ですが手で入れてください。</div><ul>' + res.partial.map(function (x) {
    return '<li><b>' + esc(x.keisai) + '</b>' + src(x) + x.reasons.map(function (w) { return '<div class="why">・' + esc(w) + '</div>'; }).join('') + '</li>';
  }).join('') + '</ul>';
  if (res.notFound.length) h += '<h4>管理表で見つからなかった回答 <span class="n">' + res.notFound.length + '件</span></h4><div class="hint" style="margin-bottom:6px">掲載名と管理表の客先名が違う、または回答日より前の号に載っていない回答です。手で入れてください。</div><ul>' + res.notFound.map(function (x) { return '<li><b>' + esc(x.keisai) + '</b></li>'; }).join('') + '</ul>';
  if (res.read && res.read.editions && res.read.editions.length) h += '<div class="hint" style="margin-top:14px">読み込んだ管理表：' + esc(res.read.editions.join('・')) + '（' + res.read.tabs + 'タブ）</div>';
  $('kBody').innerHTML = h; $('kdlg').showModal();
}
$('kClose').onclick = function () { $('kdlg').close(); };

// ---------- 未割り当て ----------
function drawTodo() {
  var rows = live().filter(function (r) { return !r.ownerEmail; });
  var mineTodo = live().filter(function (r) { return r.ownerEmail === S.me.email && (!r.genre || !r.month || !r.media); });
  $('main').innerHTML = '<div class="bar"><span class="hint" style="flex:1">フォームから届いて、まだ担当が決まっていない回答です。自分のお客さんの回答は、担当の欄で自分を選ぶか、ジャンル・掲載号・媒体・サイズを選んでください。</span>' + kanriBtn() + viewSeg() + '</div>'
    + cardsHtml(rows, '担当が決まっていない回答はありません')
    + (mineTodo.length ? '<h2 class="sec">自分の担当で、担当の情報がまだの回答（' + mineTodo.length + '件）</h2>' + cardsHtml(mineTodo, '') : '');
}

// ---------- 一覧 ----------
function opts(list, cur, first) { return '<option value="">' + first + '</option>' + list.map(function (v) { return '<option' + (v === cur ? ' selected' : '') + '>' + esc(v) + '</option>'; }).join(''); }
function owners() { var m = {}; S.rows.forEach(function (r) { if (r.ownerEmail) m[r.ownerEmail] = r.ownerName; }); return Object.keys(m).map(function (k) { return [k, m[k]]; }).sort(function (a, b) { return a[1] < b[1] ? -1 : 1; }); }
function months() { var m = {}; S.rows.forEach(function (r) { if (r.month) m[r.month] = 1; }); return Object.keys(m).sort().reverse(); }
function drawList() {
  var f = S.f, q = f.q.trim().toLowerCase();
  var rows = (S.me.isAdmin && f.showDel ? S.rows : live()).filter(function (r) {
    if (q && [r.keisai, r.hankyo, r.riyu, r.youbou, r.memo, r.ownerName].join('\n').toLowerCase().indexOf(q) < 0) return false;
    if (f.genre && r.genre !== f.genre) return false; if (f.media && r.media !== f.media) return false;
    if (f.month && r.month !== f.month) return false;
    if (f.folder === 'mine' && r.ownerEmail !== S.me.email) return false; if (f.folder === 'none' && r.ownerEmail) return false;
    if (f.folder && ['all', 'mine', 'none'].indexOf(f.folder) < 0 && r.ownerEmail !== f.folder) return false;
    if (f.sat && String(r.satHankyo) !== f.sat) return false; if (f.cost && String(r.satCost) !== f.cost) return false;
    return true;
  });
  $('main').innerHTML = '<div class="bar">'
    + '<input type="search" id="fQ" placeholder="掲載名・反響・要望で検索" value="' + esc(f.q) + '" style="min-width:220px">'
    + '<select id="fGenre">' + opts(S.masters.genres, f.genre, 'ジャンル') + '</select>'
    + '<select id="fMedia">' + opts(S.masters.media, f.media, '媒体') + '</select>'
    + '<select id="fMonth">' + monthOpts(months(), f.month, '掲載号') + '</select>'
    + '<select id="fSat"><option value="">反響満足度</option>' + [5, 4, 3, 2, 1].map(function (n) { return '<option value="' + n + '"' + (String(n) === f.sat ? ' selected' : '') + '>反響：' + LV[n] + '</option>'; }).join('') + '</select>'
    + '<select id="fCost"><option value="">費用感満足度</option>' + [5, 4, 3, 2, 1].map(function (n) { return '<option value="' + n + '"' + (String(n) === f.cost ? ' selected' : '') + '>費用感：' + LV[n] + '</option>'; }).join('') + '</select>'
    + (S.me.isAdmin ? '<label class="hint"><input type="checkbox" id="fDel"' + (f.showDel ? ' checked' : '') + '> 削除したものも</label>' : '')
    + '<span class="sp"></span>' + kanriBtn() + viewSeg() + '<span class="hint">' + rows.length + '件</span></div>'
    + cardsHtml(rows, S.rows.length ? '条件に合う回答はありません' : 'まだ回答はありません。「フォーム・設定」のURLやQRをクライアントに渡してください');
  var on = function (id, k, prop) { var el = $(id); if (!el) return; el.oninput = el.onchange = function () { S.f[k] = prop ? el[prop] : el.value; var pos = id === 'fQ' ? el.selectionStart : null; drawList(); if (pos != null) { var n = $('fQ'); n.focus(); n.setSelectionRange(pos, pos); } }; };
  on('fQ', 'q'); on('fGenre', 'genre'); on('fMedia', 'media'); on('fMonth', 'month'); on('fSat', 'sat'); on('fCost', 'cost'); on('fDel', 'showDel', 'checked');
}

// ---------- 分析 ----------
var BY = { genre: ['ジャンル', function (r) { return r.genre; }], media: ['媒体', function (r) { return r.media ? r.media + '版' : ''; }], size: ['掲載サイズ', function (r) { return r.size; }], owner: ['担当', function (r) { return r.ownerName; }], month: ['掲載号', function (r) { return fmtMonth(r.month); }], price: ['掲載料金', priceBand] };
function priceBand(r) { if (r.price === '' || r.price == null) return ''; var p = Number(r.price); return p < 20000 ? '2万円未満' : p < 50000 ? '2〜5万円' : p < 100000 ? '5〜10万円' : p < 200000 ? '10〜20万円' : '20万円以上'; }
var BAND_ORDER = ['2万円未満', '2〜5万円', '5〜10万円', '10〜20万円', '20万円以上'];
function avg(a) { return a.length ? a.reduce(function (s, x) { return s + x; }, 0) / a.length : 0; }
function distHtml(vals) { var n = vals.length || 1; return '<div class="dist" title="' + [5, 4, 3, 2, 1].map(function (k) { return LV[k] + ' ' + vals.filter(function (v) { return v === k; }).length; }).join(' / ') + '">' + [5, 4, 3, 2, 1].map(function (k) { var c = vals.filter(function (v) { return v === k; }).length; return c ? '<span style="width:' + (c / n * 100) + '%;background:' + COLORS[k] + '"></span>' : ''; }).join('') + '</div>'; }
function drawStats() {
  var st = S.st, ms = months();
  var rows = live().filter(function (r) { if (st.from && (!r.month || r.month < st.from)) return false; if (st.to && (!r.month || r.month > st.to)) return false; return true; });
  var h = rows.map(function (r) { return r.satHankyo; }).filter(Boolean), c = rows.map(function (r) { return r.satCost; }).filter(Boolean);
  var good = function (a) { return a.length ? Math.round(a.filter(function (v) { return v >= 4; }).length / a.length * 100) : 0; };
  var get = BY[st.by][1], groups = {};
  rows.forEach(function (r) { var k = get(r) || '（未入力）'; (groups[k] = groups[k] || []).push(r); });
  var keys = Object.keys(groups).sort(function (a, b) {
    if (a === '（未入力）') return 1; if (b === '（未入力）') return -1;
    if (st.by === 'price') return BAND_ORDER.indexOf(a) - BAND_ORDER.indexOf(b);
    if (st.by === 'month') return a < b ? 1 : -1;
    return groups[b].length - groups[a].length;
  });
  var tbl = '<div class="tblw"><table class="st"><tr><th>' + BY[st.by][0] + '</th><th>件数</th><th>反響満足度（平均）</th><th>反響の内訳</th><th>費用感満足度（平均）</th><th>費用感の内訳</th></tr>'
    + keys.map(function (k) { var g = groups[k], hh = g.map(function (r) { return r.satHankyo; }).filter(Boolean), cc = g.map(function (r) { return r.satCost; }).filter(Boolean);
      return '<tr><td>' + esc(k) + '</td><td class="n">' + g.length + '</td><td class="n">' + (hh.length ? avg(hh).toFixed(1) : '—') + '</td><td>' + distHtml(hh) + '</td><td class="n">' + (cc.length ? avg(cc).toFixed(1) : '—') + '</td><td>' + distHtml(cc) + '</td></tr>'; }).join('') + '</table></div>';
  $('main').innerHTML = '<div class="bar"><span>掲載号</span><select id="sFrom">' + monthOpts(ms.slice().reverse(), st.from, 'はじめから') + '</select><span>〜</span><select id="sTo">' + monthOpts(ms, st.to, '最新まで') + '</select>'
    + '<span class="sp"></span><span class="hint">満足度は 満足=5 ・やや満足=4 ・どちらともいえない=3 ・やや不満=2 ・不満=1 の平均</span></div>'
    + '<div class="kpis"><div class="kpi"><div class="l"><i style="background:#6366f1"></i>回答数</div><div class="v">' + rows.length + '<small>件</small></div></div>'
    + '<div class="kpi"><div class="l"><i style="background:#16a34a"></i>反響満足度の平均</div><div class="v">' + (h.length ? avg(h).toFixed(1) : '—') + '<small>/ 5</small></div><div class="hint">満足・やや満足 ' + good(h) + '%</div></div>'
    + '<div class="kpi"><div class="l"><i style="background:#2563eb"></i>費用感満足度の平均</div><div class="v">' + (c.length ? avg(c).toFixed(1) : '—') + '<small>/ 5</small></div><div class="hint">満足・やや満足 ' + good(c) + '%</div></div>'
    + '<div class="kpi"><div class="l"><i style="background:#f59e0b"></i>担当が決まっていない回答</div><div class="v">' + rows.filter(function (r) { return !r.ownerEmail; }).length + '<small>件</small></div></div></div>'
    + '<div class="bar"><span class="hint">くらべる切り口</span><div class="seg">' + Object.keys(BY).map(function (k) { return '<button class="' + (k === st.by ? 'on' : '') + '" data-by="' + k + '">' + BY[k][0] + '別</button>'; }).join('') + '</div></div>'
    + '<div class="legend">' + [5, 4, 3, 2, 1].map(function (k) { return '<span><i style="background:' + COLORS[k] + '"></i>' + LV[k] + '</span>'; }).join('') + '</div>'
    + (rows.length ? tbl : '<div class="empty">まだ回答はありません</div>');
  $('sFrom').onchange = function () { S.st.from = this.value; drawStats(); }; $('sTo').onchange = function () { S.st.to = this.value; drawStats(); };
  [].forEach.call(document.querySelectorAll('[data-by]'), function (b) { b.onclick = function () { S.st.by = b.dataset.by; drawStats(); }; });
}

// ---------- 事例 ----------
function drawCases() {
  var cs = S.cs;
  var rows = live().filter(function (r) { return r.satHankyo >= 4 && r.hankyo && (!cs.genre || r.genre === cs.genre) && (!cs.media || r.media === cs.media); })

    + '<select id="cGenre">' + opts(S.masters.genres, cs.genre, 'ジャンル') + '</select><select id="cMedia">' + opts(S.masters.media, cs.media, '媒体') + '</select><span class="hint">' + rows.length + '件</span></div>'

// ---------- フォーム・設定 ----------
function drawSettings() {
  var m = S.masters, ad = S.me.isAdmin;
  var mf = S.myForm, dp = S.defaultPh || {};
  $('main').innerHTML = '<h2 class="sec" style="margin-top:0">クライアントに渡すアンケート（2種類）</h2>'
    + '<div class="fcard"><h3>あなた専用のアンケート<span class="tagx mine">おすすめ</span></h3><div class="hint" style="margin-bottom:10px">このURL・QRから届いた回答は、最初から<b>あなたの担当</b>になります（「自分の担当にする」は要りません）。②④⑤のグレーの参考文も、あなた用に変えられます。</div>'
    + (mf ? '<div class="formbox"><div class="qrbox" id="qrMine"></div><div style="flex:1;min-width:240px"><div class="url"><a href="' + esc(mf.url) + '" target="_blank">' + esc(mf.url) + '</a></div>'
        + '<div class="acts" style="margin-top:8px"><button class="btn sm" data-copy="' + esc(mf.url) + '">URLをコピー</button><button class="btn sm" data-dl="qrMine" data-name="反響アンケートQR_' + esc(S.me.name) + '.png">QRを画像で保存</button></div></div></div>'
        + '<div class="phed" style="margin-top:14px"><div class="hint">参考文（空にすると共通の参考文になります）</div>'
        + [['hankyo', '② 具体的な反響'], ['riyu', '④ 費用感の理由'], ['youbou', '⑤ ご要望']].map(function (k) { return '<div class="fld"><label>' + k[1] + '</label><textarea id="ph_' + k[0] + '" maxlength="200" placeholder="' + esc(dp[k[0]] || '') + '">' + esc(mf.ph[k[0]] || '') + '</textarea></div>'; }).join('')
        + '<div class="acts" style="margin-top:10px"><button class="btn sm primary" id="phSave">参考文を保存</button><a class="btn sm" href="' + esc(mf.url) + '" target="_blank">お客様の画面を見る</a></div></div>'
      : '<button class="btn primary" id="mkForm">自分専用のアンケートを作る</button>')
    + '</div>'
    + '<div class="fcard"><h3>共通のアンケート<span class="tagx common">全社共通</span></h3><div class="hint" style="margin-bottom:10px">だれのお客さんでも使えます。届いた回答は「未割り当て」に出るので、担当が「自分の担当にする」を押します。</div>'
    + '<div class="formbox"><div class="qrbox" id="qrCommon"></div><div style="flex:1;min-width:240px"><div class="url"><a href="' + esc(S.formUrl) + '" target="_blank">' + esc(S.formUrl) + '</a></div>'
    + '<div class="acts" style="margin-top:8px"><button class="btn sm" data-copy="' + esc(S.formUrl) + '">URLをコピー</button><button class="btn sm" data-dl="qrCommon" data-name="反響アンケートQR_共通.png">QRを画像で保存</button></div></div></div></div>'
    + (ad ? '<h2 class="sec">候補（管理者だけが直せます・1行に1つ）</h2><div class="cards">'
      + [['genres', 'ジャンル'], ['media', '媒体'], ['sizes', '掲載サイズ・枠']].map(function (k) { return '<div class="rc"><b>' + k[1] + '</b><textarea id="m_' + k[0] + '" rows="8" style="width:100%;font:inherit;border:1px solid #ccc;border-radius:6px;padding:6px">' + esc((m[k[0]] || []).join('\n')) + '</textarea><div class="acts"><button class="btn sm" data-m="' + k[0] + '">保存する</button></div></div>'; }).join('')
      + '</div>' + (S.sheetUrl ? '<p class="hint">データのスプレッドシート：<a href="' + esc(S.sheetUrl) + '" target="_blank">反響事例管理データ</a>（管理者の追加は admins シートに1行）</p>' : '') : '<p class="hint">ジャンル・媒体・サイズの候補を増やしたいときは管理者に頼んでください。</p>');
  var qr = function (id, text) { try { new QRCode($(id), { text: text, width: 220, height: 220, correctLevel: QRCode.CorrectLevel.M }); } catch (x) { $(id).textContent = 'QRを作れませんでした'; } };
  qr('qrCommon', S.formUrl); if (mf) qr('qrMine', mf.url);
  [].forEach.call(document.querySelectorAll('[data-copy]'), function (b) { b.onclick = function () { var u = b.dataset.copy; (navigator.clipboard ? navigator.clipboard.writeText(u) : Promise.reject()).then(function () { toast('URLをコピーしました'); }).catch(function () { prompt('コピーしてください', u); }); }; });
  [].forEach.call(document.querySelectorAll('[data-dl]'), function (b) { b.onclick = function () { var box = $(b.dataset.dl), c = box.querySelector('canvas'), img = box.querySelector('img'); var src = c ? c.toDataURL('image/png') : img && img.src; if (!src) return; var a = document.createElement('a'); a.href = src; a.download = b.dataset.name; a.click(); }; });
  if ($('mkForm')) $('mkForm').onclick = function () { this.disabled = true; run('createMyForm').then(function (f) { S.myForm = f; toast('自分専用のアンケートを作りました'); drawSettings(); }).catch(function (e) { toast(e.message); drawSettings(); }); };
  if ($('phSave')) $('phSave').onclick = function () { var b = this; b.disabled = true; run('saveMyForm', { hankyo: $('ph_hankyo').value, riyu: $('ph_riyu').value, youbou: $('ph_youbou').value }).then(function (f) { S.myForm = f; b.disabled = false; toast('参考文を保存しました（お客様の画面に出ます）'); }).catch(function (e) { b.disabled = false; toast(e.message); }); };
  [].forEach.call(document.querySelectorAll('[data-m]'), function (b) { b.onclick = function () { var k = b.dataset.m; b.disabled = true; run('saveMaster', k, $('m_' + k).value.split('\n')).then(function (v) { S.masters[k] = v; b.disabled = false; toast('保存しました'); drawSettings(); }).catch(function (e) { b.disabled = false; toast(e.message); }); }; });
}

// ---------- 担当の情報 ----------
function openEdit(id) {
  var r = S.rows.find(function (x) { return x.id === id; }); if (!r) return;
  S.editId = id;
  $('dTitle').textContent = r.keisai;
  $('dSub').textContent = r.at + ' の回答' + (r.ownerEmail ? '・担当 ' + r.ownerName : '・保存するとあなたが担当になります');
  var sel = function (el, list, cur) { var l = list.slice(); if (cur && l.indexOf(cur) < 0) l.push(cur); el.innerHTML = '<option value="">（選ぶ）</option>' + l.map(function (v) { return '<option' + (v === cur ? ' selected' : '') + '>' + esc(v) + '</option>'; }).join(''); };
  sel($('dGenre'), S.masters.genres, r.genre); sel($('dMedia'), S.masters.media, r.media); sel($('dSize'), S.masters.sizes, r.size);
  $('dMonth').innerHTML = issueOpts(r.month || '');
  // 担当: 本人か管理者は誰にでも付け替えられる。担当なしなら自分（管理者は誰でも）
  var canAll = S.me.isAdmin || r.ownerEmail === S.me.email, cur = r.ownerEmail || S.me.email;
  var ppl = canAll ? S.people.slice() : S.people.filter(function (p) { return p.email === S.me.email; });
  if (!ppl.some(function (p) { return p.email === cur; })) ppl.unshift({ email: cur, name: r.ownerName || S.me.name });
  $('dOwner').innerHTML = ppl.map(function (p) { return '<option value="' + esc(p.email) + '"' + (p.email === cur ? ' selected' : '') + '>' + esc(p.name) + (p.email === S.me.email ? '（自分）' : '') + '</option>'; }).join('');
  $('dOwner').disabled = !canAll && !!r.ownerEmail; $('dPrice').value = r.price === '' ? '' : r.price; $('dMemo').value = r.memo || '';
  $('dMsg').textContent = ''; $('dMsg').className = 'msg'; $('dSave').disabled = false;
  $('dlg').showModal();
}
$('dCancel').onclick = function () { $('dlg').close(); };
$('dSave').onclick = function () {
  var b = this; b.disabled = true; $('dMsg').textContent = '保存しています…'; $('dMsg').className = 'msg';
  var r0 = S.rows.find(function (x) { return x.id === S.editId; }), to = $('dOwner').value;
  (to && to !== (r0.ownerEmail || '') && (r0.ownerEmail || to !== S.me.email) ? run('assign', S.editId, to) : Promise.resolve()).then(function () { return run('saveSales', S.editId, { genre: $('dGenre').value, month: $('dMonth').value, media: $('dMedia').value, size: $('dSize').value, price: $('dPrice').value, memo: $('dMemo').value }); })
    .then(function (r) { upsert(r); $('dlg').close(); toast('保存しました'); draw(); })
    .catch(function (e) { b.disabled = false; $('dMsg').textContent = e.message; $('dMsg').className = 'msg err'; });
};
// 使い方ガイド: 中身ができたら GUIDE_URL に入れる（2026-11-19 ボタンだけ先に）
var GUIDE_URL = 'https://hirayama-byte.github.io/kcreate-hankyo/guide/';
$('guideBtn').onclick = function (e) { if (GUIDE_URL) { this.href = GUIDE_URL; this.target = '_blank'; return; } e.preventDefault(); toast('使い方ガイドは準備中です'); };
