<!doctype html>
<html lang="ja">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex"><title>反響事例管理（サンプル）</title>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{--side:#0f172a;--side-2:#1e293b;--side-line:#273449;--side-text:#94a3b8;--side-hi:#f1f5f9;--bg:#f1f5f9;--card:#fff;--line:#e2e8f0;--line-2:#f1f5f9;--text:#0f172a;--muted:#64748b;--faint:#94a3b8;--accent:#2563eb;--accent-2:#3b82f6;--accent-weak:#eff6ff;--danger:#dc2626;--ok:#16a34a;--mono:"JetBrains Mono",ui-monospace,Consolas,monospace;--radius:10px;
--s5:#16a34a;--s4:#84cc16;--s3:#cbd5e1;--s2:#f59e0b;--s1:#dc2626}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Noto Sans JP",system-ui,-apple-system,"Hiragino Sans","Yu Gothic UI",sans-serif;font-size:14px;line-height:1.6}
.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
.side{background:var(--side);color:var(--side-text);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto;scrollbar-width:none}.side::-webkit-scrollbar{display:none} /* 画面が低いときはメニュー全体をスクロール・バーは出さない（2026-11-19） */
.brand{display:flex;align-items:center;gap:10px;padding:18px 18px 16px;border-bottom:1px solid var(--side-line)}
.brand .logo{width:32px;height:32px;border-radius:8px;background:linear-gradient(135deg,#34d399,#059669);display:grid;place-items:center}
.brand b{display:block;color:var(--side-hi);font-size:14px;letter-spacing:.02em}
.brand small{font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--side-text)}
#tabs{padding:12px 10px;display:flex;flex-direction:column;gap:2px}
#tabs button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;color:var(--side-text);font:inherit;font-size:13.5px;padding:9px 12px;border-radius:8px;cursor:pointer;text-align:left}
#tabs button svg{width:16px;height:16px;flex:none}
#tabs button:hover{background:var(--side-2);color:var(--side-hi)}
#tabs button.on{background:var(--side-2);color:#fff;box-shadow:inset 3px 0 0 var(--accent-2)}
.side-sec{padding:14px 22px 6px;font-size:10.5px;letter-spacing:.14em;color:#64748b;font-family:var(--mono);text-transform:uppercase}
#folders{padding:0 10px;flex:1 0 auto}
#folders button{display:flex;width:100%;justify-content:space-between;align-items:center;border:0;background:none;color:var(--side-text);font:inherit;font-size:13px;padding:6px 12px;border-radius:6px;cursor:pointer;text-align:left}
#folders button:hover{background:var(--side-2);color:var(--side-hi)}
#folders button.on{background:var(--side-2);color:#fff;font-weight:500}
#folders .n{font-family:var(--mono);font-size:11px;color:#64748b}
#folders hr{border:0;border-top:1px solid var(--side-line);margin:6px 4px}
#tabs .badge{margin-left:auto;background:var(--danger);color:#fff;border-radius:999px;font-family:var(--mono);font-size:11px;padding:0 7px}
.side .sp{flex:1}
.me{border-top:1px solid var(--side-line);padding:12px 18px;display:flex;align-items:center;gap:10px;font-size:13px;color:var(--side-hi)}
.me small{display:block;color:var(--side-text);font-size:11px}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--side-2);color:var(--side-hi);display:grid;place-items:center;font-size:12px;font-weight:700;flex:none}
.main{min-width:0}
.topbar{height:60px;background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:0 28px;position:sticky;top:0;z-index:5}
.topbar h1{font-size:17px;margin:0}
.topbar .crumb{color:var(--faint);font-size:12px}
main{padding:58px 28px 24px} /* PCでは右いっぱいまで・上は右上の「使い方ガイド」の場所（2026-11-19 オーナー指示） */
.main{position:relative}
/* 使い方ガイド: ほかのツールと同じ見た目・右上（中身は準備中） */
a.guide-link{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--text);font-size:13px;font-weight:500;text-decoration:none;white-space:nowrap}a.guide-link:hover{border-color:#94a3b8}
.gtop{position:absolute;top:14px;right:28px;z-index:6}
/* 一覧（表）: PCでは画面の高さに収め、表の中だけスクロール＝項目名の行が上に残る（QR管理と同じ・2026-11-19） */
@media (min-width:901px){body.fit .main{height:100vh;display:flex;flex-direction:column}body.fit main{flex:1;min-height:0;display:flex;flex-direction:column}body.fit main>.bar{flex:none}body.fit main>.tw{flex:0 1 auto;min-height:0}}
input,select,.btn{font:inherit;font-size:13.5px;height:36px;padding:0 12px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--text)}
input[type=checkbox]{height:auto}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent-2);box-shadow:0 0 0 3px rgba(59,130,246,.15)}
.btn{cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-weight:500;white-space:nowrap}
.btn:hover{background:#f8fafc}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.primary:hover{background:#1d4ed8}
.btn.red{color:var(--danger);border-color:#fecaca}
.btn.sm{height:30px;font-size:12.5px;padding:0 10px}
.btn:disabled{opacity:.5;cursor:default}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px 18px;margin-bottom:16px}
.bar .sp{flex:1}
.hint{color:var(--muted);font-size:12.5px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px}
.rc{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;display:flex;flex-direction:column;gap:8px;cursor:pointer;transition:border-color .15s,box-shadow .15s}
.rc:hover{border-color:#93c5fd;box-shadow:0 2px 10px rgba(37,99,235,.08)}
.dt{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:22px 24px;max-width:860px}
.dt h2{margin:0;font-size:20px}
.dt .meta{color:var(--faint);font-family:var(--mono);font-size:12px;margin:4px 0 12px}
.dt .sec{margin-top:18px}
.dt .sec b{display:block;font-size:12px;color:var(--muted);font-weight:500;letter-spacing:.04em;margin-bottom:4px}
.dt .sec .t{white-space:pre-wrap;word-break:break-word;font-size:14.5px;line-height:1.8;background:#f8fafc;border:1px solid var(--line-2);border-radius:8px;padding:10px 14px}
.dt .sec .t.no{color:var(--faint)}
.dt table{border-collapse:collapse;width:100%;max-width:520px}
.dt td,.dt th{text-align:left;padding:7px 10px;border-bottom:1px solid var(--line-2);font-size:13.5px}
.dt th{width:130px;color:var(--muted);font-weight:500;font-size:12.5px}
.dt .acts{margin-top:20px}
.back{margin-bottom:14px}
.rc.del{opacity:.55}
.rc h3{margin:0;font-size:15px;font-weight:700;display:flex;gap:8px;align-items:baseline;min-width:0}
.rc h3 .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.rc h3 .at{margin-left:auto;font-size:12px;color:var(--faint);font-weight:500;font-family:var(--mono);white-space:nowrap}
.sat{display:flex;gap:6px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border-radius:999px;font-size:12px;white-space:nowrap;background:var(--pb);color:var(--pc)}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--pc)}
.p5{--pb:#dcfce7;--pc:#15803d}.p4{--pb:#ecfccb;--pc:#4d7c0f}.p3{--pb:#f1f5f9;--pc:#475569}.p2{--pb:#fef3c7;--pc:#b45309}.p1{--pb:#fee2e2;--pc:#b91c1c}
.qa{font-size:13px;line-height:1.6}
.qa b{display:block;font-size:11px;color:var(--muted);font-weight:500;letter-spacing:.04em;line-height:1.5}
.qa .t{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;height:3.2em;word-break:break-word;white-space:normal}
.qa.one .t{-webkit-line-clamp:1;height:1.6em}
.qa .t.no{color:var(--faint)}
.sales{display:flex;flex-wrap:nowrap;gap:4px;font-size:12px;border-top:1px solid var(--line-2);padding-top:8px;overflow:hidden;height:30px;white-space:nowrap}
.sales .chip{flex:none}
.rc .acts{margin-top:auto;min-height:30px}
.chip{background:var(--accent-weak);color:var(--accent);border-radius:5px;padding:1px 7px}
.chip.none{background:#fff7ed;color:#c2410c}
.acts{display:flex;gap:6px;flex-wrap:wrap}
.empty{background:var(--card);border:1.5px dashed var(--line);border-radius:var(--radius);padding:32px;text-align:center;color:var(--faint)}
.tblw{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:auto}
table.st{width:100%;border-collapse:collapse}
table.st th,table.st td{padding:11px 14px;border-bottom:1px solid var(--line-2);text-align:left;vertical-align:middle;font-size:13px}
table.st th{font-size:11px;color:var(--muted);font-weight:500;letter-spacing:.06em;white-space:nowrap;background:#f8fafc;border-bottom:1px solid var(--line)}
table.st td.n{text-align:right;white-space:nowrap;font-family:var(--mono)}
.dist{display:flex;height:8px;border-radius:4px;overflow:hidden;min-width:160px;background:#eef2f7}
.dist span{display:block;height:100%}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:0 0 10px}
.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:1px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:16px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px}
.kpi .l{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.kpi .l i{width:7px;height:7px;border-radius:2px;display:inline-block}
.kpi .v{font-family:var(--mono);font-size:26px;font-weight:500;margin-top:6px;letter-spacing:-.01em}
.kpi .v small{font-size:12px;color:var(--faint);margin-left:4px;font-family:"Noto Sans JP",sans-serif}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;border-right:1px solid var(--line);background:#fff;font:inherit;font-size:12.5px;padding:0 12px;height:34px;cursor:pointer;color:var(--muted)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--accent-weak);color:var(--accent);font-weight:500}
h2.sec{font-size:14px;margin:22px 0 10px;color:var(--text)}
dialog{border:0;border-radius:12px;padding:0;width:min(520px,94vw);box-shadow:0 20px 50px rgba(15,23,42,.25)}
dialog::backdrop{background:rgba(15,23,42,.45)}
.dlg{padding:20px 22px}
.dlg h3{margin:0 0 2px;font-size:16px}
.fld{margin-top:12px}
.fld label{display:block;font-size:12.5px;font-weight:500;color:var(--muted);margin-bottom:4px}
.fld input,.fld select,.fld textarea{width:100%}
.fld textarea{font:inherit;border:1px solid var(--line);border-radius:8px;padding:8px 12px;min-height:70px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.dlg .acts{justify-content:flex-end;margin-top:16px}
.msg{font-size:13px;margin-top:8px;min-height:1em}
.msg.err{color:var(--danger)}
.formbox{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.qrbox{background:#fff;padding:8px;border:1px solid var(--line);border-radius:8px;flex:none}
.qrbox img,.qrbox canvas{display:block;width:120px;height:120px}
.fcard{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;margin-bottom:14px}
.fcard h3{margin:0 0 4px;font-size:15px;display:flex;align-items:center;gap:8px}
.fcard .tagx{font-size:11px;font-weight:500;border-radius:999px;padding:1px 9px}
.tagx.common{background:#f1f5f9;color:#475569}.tagx.mine{background:#dcfce7;color:#15803d}
.fcard .url{word-break:break-all;font-size:13px}
.phed .fld textarea{min-height:52px}
.seg2{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg2 button{border:0;border-right:1px solid var(--line);background:#fff;font:inherit;font-size:12.5px;padding:0 12px;height:34px;cursor:pointer;color:var(--muted);display:inline-flex;align-items:center;gap:5px}
.seg2 button:last-child{border-right:0}.seg2 button.on{background:var(--accent-weak);color:var(--accent);font-weight:500}
.seg2 svg{width:14px;height:14px}
.tw{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:auto;width:fit-content;max-width:100%}
table.lt{border-collapse:collapse}
table.lt th{font-size:11px;color:var(--muted);font-weight:500;letter-spacing:.06em;white-space:nowrap;background:#f8fafc;border-bottom:1px solid var(--line);text-align:left;padding:9px 6px;position:sticky;top:0;z-index:1}
table.lt td{padding:6px 6px;border-bottom:1px solid var(--line-2);font-size:13px;vertical-align:middle;white-space:nowrap}
select.inl{font:inherit;font-size:12.5px;height:30px;border:1px solid var(--line);border-radius:6px;background:#fff;padding:0 4px;max-width:128px;cursor:pointer;color:var(--text)}select.inl:hover{border-color:var(--accent)}select.inl.none{color:var(--faint)}select.inl:disabled{opacity:.5}
.dt table.ed td{padding:5px 10px}.dt table.ed select.inl{max-width:260px;height:34px;font-size:13.5px}input.inl{font:inherit;font-size:13.5px;height:34px;border:1px solid var(--line);border-radius:6px;padding:0 10px}
textarea.inl.memo{display:block;width:100%;box-sizing:border-box;min-height:84px;font:inherit;font-size:14px;line-height:1.7;border:1px solid var(--line);border-radius:8px;padding:10px 14px;resize:vertical}
table.lt tr.r{cursor:pointer}table.lt tr.r:hover td{background:#f8fafc}table.lt tr.del td{opacity:.55}
table.lt th:first-child,table.lt td:first-child{padding-left:12px}table.lt th:last-child,table.lt td:last-child{padding-right:12px}
/* 担当は5文字分（長い名前は見切れる・2026-11-19） */
table.lt select.inl.own{width:6.8em}table.lt td.own .nm3{display:inline-block;max-width:5em;overflow:hidden;text-overflow:ellipsis;vertical-align:middle}
table.lt td.nm2{font-weight:500;max-width:200px;overflow:hidden;text-overflow:ellipsis}
table.lt td.tx{max-width:280px;overflow:hidden;text-overflow:ellipsis;color:#334155}
table.lt td.num{text-align:right;font-family:var(--mono)}
table.lt td.dt2{font-family:var(--mono);font-size:12px;color:var(--muted)}
table.lt .via{font-size:10.5px;color:#15803d;background:#dcfce7;border-radius:4px;padding:0 5px;margin-left:4px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#0f172a;color:#fff;border-radius:8px;padding:9px 16px;font-size:13px;display:none;z-index:20}
.loading{padding:40px;text-align:center;color:var(--faint)}
a{color:var(--accent)}
@media (max-width:900px){.side{overflow:visible}main{padding-top:56px !important}.side-sec,#folders{display:none}.app{grid-template-columns:1fr}.side{position:static;height:auto}.brand{padding:12px 16px}#tabs{flex-direction:row;flex-wrap:wrap;padding:8px}#tabs button{width:auto;padding:7px 10px}.side .sp,.me{display:none}.topbar{padding:0 16px;height:52px}main{padding:16px}.cards{grid-template-columns:1fr}.row2{grid-template-columns:1fr}}
  .tools { border-top: 1px solid var(--side-line); padding: 8px 10px 6px; }
  .tools .tools-h { padding: 6px 12px 4px; font-size: 10.5px; letter-spacing: .14em; color: #64748b; font-family: var(--mono); text-transform: uppercase; }
  .tools a { display: flex; align-items: center; gap: 10px; color: var(--side-text); text-decoration: none; font-size: 13px; padding: 7px 12px; border-radius: 8px; }
  .tools a:hover { background: var(--side-2); color: var(--side-hi); }
  .tools a svg { width: 16px; height: 16px; flex: none; opacity: .85; }
  .tools a .ext { margin-left: auto; font-size: 11px; color: #64748b; }
  @media (max-width: 900px) { .tools { display: flex; gap: 4px; padding: 6px 10px 10px; border-top: 0; overflow-x: auto; } .tools .tools-h { display: none; } .tools a { padding: 6px 10px; white-space: nowrap; } .tools a .ext { display: none; } }
</style>
</head>

<div class="app">

(function (root) {
  function colNum(s) { var n = 0; for (var i = 0; i < s.length; i++) n = n * 26 + s.charCodeAt(i) - 64; return n; }

  function Sheet(name) { this.name = name; this.data = []; this.textCols = {}; }

  Sheet.prototype.appendRow = function (r) { this.data[this.getLastRow()] = this._conv(r.slice(), 1); return this; }; // 本物と同じく最後の中身のある行の次に

  Sheet.prototype._conv = function (row, c0) {

  Sheet.prototype.getRange = function (a, c, nr, nc) {

      var cv = this.sh._conv(vals[i], this.c);

  Range.prototype.setNumberFormat = function (f) { if (f === '@') for (var j = 0; j < this.nc; j++) this.sh.textCols[this.c + j] = true; return this; };

      }
    };
    return tf;
  };

  Spreadsheet.prototype.getId = function () { return this.id; };
  Spreadsheet.prototype.getUrl = function () { return 'https://docs.google.com/spreadsheets/d/' + this.id; };
  Spreadsheet.prototype.getSpreadsheetTimeZone = function () { return this.tz || 'GMT'; };
  Spreadsheet.prototype.setSpreadsheetTimeZone = function (tz) { this.tz = tz; };
  Spreadsheet.prototype.getSheetByName = function (n) { return this.sheets.filter(function (s) { return s.name === n; })[0] || null; };
  Spreadsheet.prototype.insertSheet = function (n) { var s = new Sheet(n); this.sheets.push(s); return s; };
  Spreadsheet.prototype.deleteSheet = function (s) { this.sheets.splice(this.sheets.indexOf(s), 1); };
  Spreadsheet.prototype.getSheets = function () { return this.sheets.slice(); };
  Sheet.prototype.deleteRow = function (r) { this.data.splice(r - 1, 1); return this; };

  function pad(n) { return ('0' + n).slice(-2); }
  function lock_() { return { waitLock: function () {}, tryLock: function () { return true; }, releaseLock: function () {} }; }

  // store: 複数プロジェクトで共有するスプレッドシート置き場
  function makeEnv(store, opts) {
    opts = opts || {};
    var props = {};
    var env = {
      user: opts.user || 'owner@k-create.co.jp',
      now: null, // テストで日時を固定するとき Date を入れる
      SpreadsheetApp: {
        create: function (n) { var id = 'sheet' + (Object.keys(store).length + 1); store[id] = new Spreadsheet(id, n); return store[id]; },
        flush: function () {},
        openById: function (id) { if (!store[id]) throw new Error('no sheet ' + id); return store[id]; },
        newDataValidation: function () { var b = { list: null, requireValueInList: function (l) { b.list = l; return b; }, setAllowInvalid: function () { return b; }, setHelpText: function () { return b; }, build: function () { return { list: b.list }; } }; return b; }
      },
      PropertiesService: {
        getScriptProperties: function () { return {
          getProperty: function (k) { return props.hasOwnProperty(k) ? props[k] : null; },
          setProperty: function (k, v) { props[k] = String(v); }
        }; },
        // ユーザーごとの入れ物（本物も人ごとに別）
        getUserProperties: function () { var u = env.user; env.userProps[u] = env.userProps[u] || {}; var o = env.userProps[u]; return {
          getProperty: function (k) { return o.hasOwnProperty(k) ? o[k] : null; },
          setProperty: function (k, v) { o[k] = String(v); }
        }; }
      },
      userProps: {},
      // 時限トリガー（持ち主ごと）。env.triggers = [{owner, fn}]
      triggers: [],
      ScriptApp: {
        getService: function () { return { getUrl: function () { return opts.scriptUrl || ''; } }; },
        getProjectTriggers: function () { return env.triggers.filter(function (t) { return t.owner === env.user; }).map(function (t) { return { getHandlerFunction: function () { return t.fn; }, _t: t }; }); },
        deleteTrigger: function (tr) { var i = env.triggers.indexOf(tr._t); if (i >= 0) env.triggers.splice(i, 1); },
        newTrigger: function (fn) { var b = { timeBased: function () { return b; }, atHour: function () { return b; }, everyDays: function () { return b; }, everyHours: function () { return b; }, create: function () { env.triggers.push({ owner: env.user, fn: fn }); } }; return b; }
      },
      Session: {
        getActiveUser: function () { return { getEmail: function () { return env.user; } }; },
        getEffectiveUser: function () { return { getEmail: function () { return opts.owner || 'owner@k-create.co.jp'; } }; }
      },
      Utilities: { formatDate: function (d, tz, f) {
        var off = /^(GMT|UTC|Etc\/)/i.test(String(tz || '')) ? 0 : 9; // 日本時間（+9）か GMT（0）だけ区別する簡易版
        var t = new Date(d.getTime() + off * 3600000);
        return f.replace('yyyy', t.getUTCFullYear()).replace('yy', String(t.getUTCFullYear()).slice(2)).replace('MM', pad(t.getUTCMonth() + 1)).replace('dd', pad(t.getUTCDate()))

      }; } },
      // 送ったメールは env.mails に溜まる。MailApp の残り通数は 1500 − 今日送った数（送信者ごと）
      mails: [],
      GmailApp: { sendEmail: function (to, subject, body, opt) {
        if (/@fail\./.test(to)) throw new Error('Invalid email: ' + to);

      } },
      MailApp: { sendEmail: function (to, subject, body) { env.notices = env.notices || []; env.notices.push({ from: env.user, to: to, subject: subject, body: body }); }, getRemainingDailyQuota: function () { return 1500 - env.mails.filter(function (m) { return m.from === env.user; }).length; } },
      ContentService: {

      fetchAll: function (reqs) { return reqs.map(function (r) { return env.worker.fetch(r.url, r); }); }
    };
    return env;
  }

  // Cloudflare Worker（worker/src/index.js）と同じ受け答えをするメモリ上の偽物（開封・クリック・配信停止）
  function fakeWorker() {
    var w = { campaigns: {}, sends: {}, recipient: {}, opens: {}, clicks: {}, unsub: {}, unsubLog: [], token: 'test-token', down: false, calls: [] };
    function res(code, body) { return { getResponseCode: function () { return code; }, getContentText: function () { return JSON.stringify(body); } }; }
    function stamp(t) { var d = new Date((t || Date.now()) + 9 * 3600000); return d.toISOString().slice(0, 16).replace('T', ' '); }
    w.open = function (token, t) { var o = w.opens[token] || (w.opens[token] = { first: stamp(t), count: 0 }); o.count++; };
    w.click = function (token, n, t) { var c = w.clicks[token] || (w.clicks[token] = {}); c[n] = (c[n] || 0) + 1; if (!w.opens[token]) w.open(token, t); };
    w.unsubscribe = function (token, t) { if (w.unsub[token]) return; w.unsub[token] = stamp(t); w.unsubLog.push({ id: w.unsubLog.length + 1, token: token }); }; // 本物は unsub テーブルの rowid（増えるだけ）
    w.fetch = function (url, opt) {
      if (w.down) return res(503, { error: 'down' });
      if ((opt.headers || {}).Authorization !== 'Bearer ' + w.token) return res(401, { error: 'unauthorized' });
      var u = new URL(url), p = u.pathname, q = u.searchParams, m = (opt.method || 'get').toLowerCase();
      w.calls.push(m + ' ' + p);
      if (p === '/api/dm/campaigns' && m === 'post') { var b = JSON.parse(opt.payload); w.campaigns[b.id] = { links: b.links || [] }; return res(200, { ok: true }); }
      if (p === '/api/dm/sends' && m === 'post') { var l = JSON.parse(opt.payload); if (l.length > 5000) return res(400, { error: 'array required' }); l.forEach(function (x) { w.sends[x.token] = x.campaign; if (x.recipient) w.recipient[x.token] = x.recipient; }); return res(200, { ok: true }); }
      // 前回以降に増えた配信停止（2026-11-03〜）。id = 取り込みの続きの番号
      if (p === '/api/dm/unsubs' && m === 'get') {
        if (w.noUnsubsApi) return res(404, { error: 'not found' });
        var after = Number(q.get('after') || 0), lim = Math.min(Number(q.get('limit') || 1000), 1000);
        var list = w.unsubLog.filter(function (x) { return x.id > after; }).slice(0, lim).map(function (x) { return { id: x.id, token: x.token, campaign: w.sends[x.token] || null, recipient: w.recipient[x.token] || null, at: w.unsub[x.token] }; });
        return res(200, { list: list, last: list.length ? list[list.length - 1].id : after });
      }
      if (p === '/api/dm/stats' && m === 'get') {
        var id = q.get('campaign'), out = { opens: {}, clicks: {}, unsub: {} };
        Object.keys(w.sends).forEach(function (t) { if (w.sends[t] !== id) return; if (w.opens[t]) out.opens[t] = w.opens[t]; if (w.clicks[t]) out.clicks[t] = w.clicks[t]; if (w.unsub[t]) out.unsub[t] = w.unsub[t]; });
        return res(200, out);
      }
      if (p === '/api/dm/summary' && m === 'post') {
        var out2 = {}, ids2 = JSON.parse(opt.payload);
        if (!Array.isArray(ids2) || ids2.length > 5000) return res(400, { error: 'array required' });
        ids2.forEach(function (id) {
          var s = { opened: 0, clicked: 0, unsub: 0 };
          Object.keys(w.sends).forEach(function (t) { if (w.sends[t] !== id) return; if (w.opens[t]) s.opened++; if (w.clicks[t]) s.clicked++; if (w.unsub[t]) s.unsub++; });
          out2[id] = s;
        });
        return res(200, out2);
      }
      return res(404, { error: 'not found' });
    };
    return w;
  }

  if (typeof module !== 'undefined') module.exports = root.GasMock;
})(typeof window !== 'undefined' ? window : globalThis);

</script>

var API = "// 反響事例管理 — フォームの受け口（公開）。スプレッドシート「反響事例管理データ」に付属\n// デプロイ: ウェブアプリ / 実行ユーザー=自分 / アクセス=全員（フォームは社外のクライアントが使う）\n// ここでできるのは「回答を1件ためる」だけ。読み出し・変更は社内の管理サイト（gas-admin）から\n\nvar TZ = 'Asia/Tokyo';\nvar VERSION = '1';\n// responses シートの列（gas-admin と同じ並び。変えるときは両方）\nvar RESP_HEAD = ['id', 'at', 'keisai', 'sat_hankyo', 'hankyo', 'sat_cost', 'riyu', 'youbou',\n  'owner_email', 'owner_name', 'claimed_at', 'genre', 'month', 'media', 'size', 'price', 'memo', 'updated', 'deleted', 'deleted_by', 'via'];\n// via（21列目・2026-11-19〜）= 担当者専用フォームから来た回答ならそのフォームの印（token）。共通フォームは空\n// forms シート（担当者専用フォーム・gas-admin が作る）: token, email, name, ph_hankyo, ph_riyu, ph_youbou, created, updated\nvar TOKEN_RE = /^[a-z0-9]{6,16}$/;\nvar MAX = { keisai: 100, hankyo: 1000, riyu: 1000, youbou: 1000 };\n\nfunction doGet() { return json_({ ok: true, version: VERSION }); }\nfunction doPost(e) {\n  var req;\n  try { req = JSON.parse((e && e.postData && e.postData.contents) || '{}'); } catch (x) { return json_({ error: '送信の形が正しくありません' }); }\n  try {\n    if (String(req.action || '') === 'submit') return json_(submit_(req.data || {}));\n    if (String(req.action || '') === 'form') { var f = form_(req.t); return json_(f ? { ok: true, ph: f.ph } : { ok: false }); }\n    return json_({ error: '不明な操作です' });\n  } catch (x) { console.error(x); return json_({ error: String(x && x.message || x) }); }\n}\nfunction json_(o) { return ContentService.createTextOutput(JSON.stringify(o)).setMimeType(ContentService.MimeType.JSON); }\n\nfunction clean_(v, n) { return String(v == null ? '' : v).replace(/\\r\\n?/g, '\\n').replace(/[\\u0000-\\u0008\\u000b\\u000c\\u000e-\\u001f]/g, '').trim().slice(0, n); }\n// 先頭が = + - @ だとシートが式として読むので、文字として入れる\nfunction safe_(s) { return /^[=+\\-@]/.test(s) ? \"'\" + s : s; }\nfunction sat_(v) { var n = Number(v); if (!(n >= 1 && n <= 5 && Math.floor(n) === n)) throw new Error('満足度を選んでください'); return n; }\n\n// 担当者専用フォームの設定（参考文）。担当者の名前・メールはクライアントに見せない\nfunction form_(t) {\n  t = String(t tRange(r, 4).setNumberFormat('0'); sh.getRange(r, 6).setNumberFormat('0');\n    rg.setValues([vals]);\n    return { ok: true };\n  } finally { lock.releaseLock(); }\n}\n\nfunction sheet_() {\n  var ss = SpreadsheetApp.getActiveSpreadsheet(), sh = ss.getSheetByName('responses');\n  if (ss.getSpreadsheetTimeZone && ss.getSpreadsheetTimeZone() !== TZ) ss.setSpreadsheetTimeZone(TZ);\n  if (!sh) {\n    sh = ss.insertSheet('responses');\n    sh.getRange(1, 1, 1, RESP_HEAD.length).setValues([RESP_HEAD]);\n    sh.getRange('A:C').setNumberFormat('@'); sh.getRange('E:E').setNumberFormat('@'); sh.getRange('G:T').setNumberFormat('@');\n    sh.setFrozenRows(1);\n    var def = ss.getSheetByName('シート1') || ss.getSheetByName('Sheet1'); if (def && ss.getSheets().length > 1) ss.deleteSheet(def);\n  }\n  if (String(sh.getRange(1, RESP_HEAD.length).getValue()) !== RESP_HEAD[RESP_HEAD.length - 1]) sh.getRange(1, RESP_HEAD.length).setValue(RESP_HEAD[RESP_HEAD.length - 1]); // 後から足した列の見出し\n  return sh;\n}\n", ADMIN = "// 反響事例管理 — 管理サイト（社内のみ）\n// デプロイ: ウェブアプリ / 実行ユーザー=自分 / アクセス=ドメイン内のユーザー\n// 全員が全部見られる。担当の情報（ジャンル・掲載号・媒体・サイズ・料金）を入れる／直す／消すのは担当本人と管理者\n\nvar TZ = 'Asia/Tokyo';\nvar SHEET_ID = '1w-4FIkRfEjiCEo6LwKKb8CoXMOvT7_c6ASFpVkrO3ks'; // 反響事例管理データ（フォームの受け口 gas-api の親）\nvar QR_SHEET_ID = '1riYm2WOMEeZBq0Te6BsqBumQFvPji9oYuZa8c6_So0o'; // 名前はQR管理の members（社内スタッフ名簿から流し込み済み）を借りる\nvar ADMIN_EMAIL = 'hirayama@k-create.co.jp';\n// responses シートの列（gas-api と同じ並び）\nvar RESP_HEAD = ['id', 'at', 'keisai', 'sat_hankyo', 'hankyo', 'sat_cost', 'riyu', 'youbou',\n  'owner_email', 'owner_name', 'claimed_at', 'genre', 'month', 'media', 'size', 'price', 'memo', 'updated', 'deleted', 'deleted_by', 'via'];\n// via（21列目・2026-11-19〜）= 担当者専用フォームから来た回答の印（gas-api と同じ）\n// 担当者専用フォーム（2026-11-19〜）: 1人1つ。URL は FORM_URL?t=<token>。参考文（②④⑤のグレーの例文）を人ごとに変えられる\nvar FORMS_HEAD = ['token', 'email', 'name', 'ph_hankyo', 'ph_riyu', 'ph_youbou', 'created', 'updated'];\nvar DEFAULT_PH = { hankyo: '10件の応募があった・5件の新規獲得ができた・売上が上がった・来 ndRow([ADMIN_EMAIL]);\n  ensureSheet_('settings', ['key', 'value']);\n  var def = ss_().getSheetByName('シート1') || ss_().getSheetByName('Sheet1'); if (def && ss_().getSheets().length > 1) ss_().deleteSheet(def);\n}\nfunction col_(name) { var sh = ss_().getSheetByName(name); if (!sh || sh.getLastRow() < 2) return []; return sh.getRange(2, 1, sh.getLastRow() - 1, 1).getValues().map(function (r) { return String(r[0]).trim(); }).filter(String); }\nfunction setting_(key) { var sh = ss_().getSheetByName('settings'); if (!sh || sh.getLastRow() < 2) return ''; var v = sh.getRange(2, 1, sh.getLastRow() - 1, 2).getValues(); for (var i = 0; i < v.length; i++) if (String(v[i][0]) === key) return String(v[i][1]); return ''; }\n\n// ---------- 人 ----------\nfunction myEmail_() { return String(Session.getActiveUser().getEmail() || '').toLowerCase(); }\nfunction isAdmin_(email) { return col_('admins').some(function (e) { return e.toLowerCase() === email; }); }\nfunction names_() {\n  if (memo_.names) return memo_.names;\n  var m = {};\n  try {\n    var sh = SpreadsheetApp.openById(QR_SHEET_ID).getSheetByName('members');\n    if (sh && sh.getLastRow() > 1) sh.getRange(2, 1, sh.getLastRow() - 1, 2).getValues().forEach(function (r) { if (r[0] && r[1]) m[String(r[0]).toLowerCase()] = String(r[1]); });\n  } catch (x) { console.error('名前を読めません: ' + x); }\n  return (memo_.names = m);\n}\nfunction nameOf_(email) { return names_()[email] || String(email).split('@')[0]; }\n\n// ---------- 回答 ----------\nfunction str_(v) { return v instanceof Date ? Utilities.formatDate(v, TZ, 'yyyy-MM-dd HH:mm') : String(v == null ? '' : v); }\nfunction month_(v) { return v instanceof Date ? Utilities.formatDate(v, TZ, 'yyyy-MM') : String(v == null ? '' : v); }\nfunction rowObj_(r) {\n  var o = {}; RESP_HEAD.forEach(function (k, i) { o[k] = r[i]; });\n  return {\n    id: str_(o.id), at: str_(o.at), keisai: str_(o.keisai).replace(/^'/, ''), satHankyo: Number(o.sat_hankyo) || 0, hankyo: str_(o.hankyo).replace(/^'/, ''),\n    satCost: Number(o.sat_cost) || 0, riyu: str_(o.riyu).replace(/^'/, ''), youbou: str_(o.youbou).replace(/^'/, ''),\n    ownerEmail: str_(o.owner_email).toLowerCase(), ownerName: str_(o.owner_name), claimedAt: str_(o.claimed_at),\n    genre: str_(o.genre), month: month_(o.month), media: str_(o.media), size: str_(o.size),\n    price: o.price === '' || o.price == null ? '' : Number(String(o.price).replace(/[^\\d.]/g, '')) || 0, memo: str_(o.memo),\n    updated: str_(o.updated), deleted: str_(o.deleted), deletedBy: str_(o.deleted_by), via: str_(o.via)\n  };\n}\nfunction allRows_() {\n  var sh = respSheet_(), n = sh.getLastRow();\n  if (n < 2) return [];\n  return sh.getRange(2, 1, n - 1, RESP_HEAD.length).getValues().map(rowObj_).filter(function (o) { return o.id; });\n}\nfunction findRow_(id) {\n  id = String(id || '');\n  if (!/^R\\d{12,}$/.test(id)) throw new Error('回答のIDが正しくありません');\n  var sh = respSheet_(), hit = sh.getRange('A:A').createTextFinder(id).matchEntireCell(true).findNext();\n  if (!hit || hit.getRow() < 2) throw new Error('この回答は見つかりません（ほかの人が消したかもしれません）');\n  return { sh: sh, row: hit.getRow(), obj: rowObj_(sh.getRange(hit.getRow(), 1, 1, RESP_HEAD.length).getValues()[0]) };\n}\nfunction setCols_(f, kv) {\n  Object.keys(kv).forEach(function (k) { var c = RESP_HEAD.indexOf(k); if (c >= 0) f.sh.getRange(f.row, c + 1).setValue(kv[k]); });\n}\nfunction now_() { return Utilities.formatDate(new Date(), TZ, 'yyyy-MM-dd HH:mm'); }\nfunction withLock_(fn) { var l = LockService.getScriptLock(); l.waitLock(20000); try { return fn(); } finally { l.releaseLock(); } }\nfunction canEdit_(o, me) { return o.ownerEmail === me || isAdmin_(me); }\n\n// ---------- 画面から呼ぶ ----------\nfunction init() {\n  var me = myEmail_();\n  if (!me) throw new Error('会社のGoogleアカウントで開いてください');\n  if (!ss_().getSheetByName('admins')) setup_();\n  if (ss_().getSpreadsheetTimeZone() !== TZ) ss_().setSpreadsheetTimeZone(TZ); // 作ったときの初期値が日本時間でないことがある（2026-11-18 9時間ずれ）\n  var admin = isAdmin_(me);\n  var rows = allRows_().filter(function (o) { return admin || !o.deleted; });\n  return {\n    me: { email: me, name: nameOf_(me), isAdmin: admin },\n    masters: { genres: col_('genres'), media: col_('media'), sizes: col_('sizes') },\n    formUrl: setting_('form_url') || FORM_URL,\n    myForm: myForm_(me),\n    defaultPh: DEFAULT_PH,\n    people: people_(),\n    sheetUrl: admin ? ss_().getUrl() : '',\n    rows: rows\n  };\n}\nfunction listRows() { var me = myEmail_(), admin = isAdmin_(me); return allRows_().filter(function (o) { return admin || !o.deleted; }); }\n\n// 自分の担当にする（まだ担当がいない回答だけ。管理者は付け替えもできる）\nfunction claim(id, toEmail) {\n  var me = myEmail_();\n  return withLock_(function () {\n    var f = findRow_(id);\n    if (f.obj.deleted) throw new Error('削除された回答です');\n    var who = me;\n    if (toEmail && isAdmin_(me)) who = String(toEmail).toLowerCase();\n    else if (f.obj.ownerEmail && f.obj.ownerEmail !== me) throw new Error('すでに ' + f.obj.ownerName + ' さんの担当です');\n    setCols_(f, { owner_email: who, owner_name: nameOf_(who), claimed_at: now_(), updated: now_() });\n    return rowObj_(f.sh.getRange(f.row, 1, 1, RESP_HEAD.length).getValues()[0]);\n  });\n}\n// 担当を付け替える（QR管理と同じ・担当本人と管理者）。相手は社内の名簿にいる人だけ\nfunction assign(id, toEmail) {\n  var me = myEmail_(), to = String(toEmail || '').trim().toLowerCase();\n  if (!to || !names_()[to]) throw new Error('担当にする人を選んでください（社内の名簿にいる人だけ）');\n  return withLock_(function () {\n    var f = findRow_(id);\n    if (f.obj.deleted) throw new Error('削除された回答です');\n    if (f.obj.ownerEmail && !canEdit_(f.obj, me)) throw new Error('担当の ' + f.obj.ownerName + ' さんか管理者だけが付け替えられます');\n    if (!f.obj.ownerEmail && to !== me && !isAdmin_(me)) throw new Error('担当がいない回答をほかの人に付けられるのは管理者だけです');\n    setCols_(f, { owner_email: to, owner_name: nameOf_(to), claimed_at: now_(), updated: now_() });\n    return rowObj_(f.sh.getRange(f.row, 1, 1, RESP_HEAD.length).getValues()[0]);\n  });\n}\n// 名簿（担当の付け替えで選ぶ人）\nfunction people_() { var m = names_(); return Object.keys(m).map(function (e) { return { email: e, name: m[e] }; }).sort(function (a, b) { return a.name < b.name ? -1 : 1; }); }\n// ---------- 担当者専用フォーム ----------\nfunction formsSheet_() { var sh = ensureSheet_('forms', FORMS_HEAD); return sh; }\nfunction myForm_(email) {\n  var sh = formsSheet_(), n = sh.getLastRow(), v = n > 1 ? sh.getRange(2, 1, n - 1, FORMS_HEAD.length).getValues() : [];\n  for (var i = 0; i < v.length; i++) if (String(v[i][1]).toLowerCase() === email) return { token: String(v[i][0]), url: (setting_('form_url') || FORM_URL) + '?t=' + v[i][0], ph: { hankyo: String(v[i][3] || ''), riyu: String(v[i][4] || ''), youbou: String(v[i][5] || '') } };\n  return null;\n}\n// 自分専用フォームを作る（まだなければ）\nfunction createMyForm() {\n  var me = myEmail_(); if (!me) throw new Error('会社のGoogleアカウントで開いてください');\n  return withLock_(function () {\n    var cur = myForm_(me); if (cur) return cur;\n    var sh = formsSheet_(), used = {}; if (sh.getLastRow() > 1) sh.getRange(2, 1, sh.getLastRow() - 1, 1).getValues().forEach(function (r) { used[String(r[0])] = 1; });\n    var t; do { t = ''; for (var i = 0; i < 8; i++) t += TOKEN_CHARS.charAt(Math.floor(Math.random() * TOKEN_CHARS.length)); } while (used[t]);\n    var r = sh.getLastRow() + 1; sh.getRange(r, 1, 1, FORMS_HEAD.length).setNumberFormat('@').setValues([[t, me, nameOf_(me), '', '', '', now_(), now_()]]);\n    return myForm_(me);\n  });\n}\n// 自分専用フォームの参考文を変える（空にすると共通の参考文）\nfunction saveMyForm(ph) {\n  var me = myEmail_(); ph = ph || {};\n  var c = function (v) { var x = String(v == null ? '' : v).replace(/\\r?\\n/g, ' ').trim().slice(0, 200); return /^[=+\\-@]/.test(x) ? \"'\" + x : x; };\n  return withLock_(function () {\n    if (!myForm_(me)) throw new Error('先に自分専用フォームを作ってください');\n    var sh = formsSheet_(), v = sh.getRange(2, 1, sh.getLastRow() - 1, 2).getValues();\n    for (var i = 0; i < v.length; i++) if (String(v[i][1]).toLowerCase() === me) { sh.getRange(i + 2, 3, 1, 4).setValues([[nameOf_(me), c(ph.hankyo), c(ph.riyu), c(ph.youbou)]]); sh.getRange(i + 2, 8).setValue(now_()); break; }\n    return myForm_(me);\n  });\n}\n// 担当をはずす（本人か管理者）\nfunction release(id) {\n  var me = myEmail_();\n  return withLock_(function () {\n    var f = findRow_(id);\n    if (!canEdit_(f.obj, me)) throw new Error('担当の人か管理者だけができます');\n    setCols_(f, { owner_email: '', owner_name: '', claimed_at: '', updated: now_() });\n    return rowObj_(f.sh.getRange(f.row, 1, 1, RESP_HEAD.length).getValues()[0]);\n  });\n}\n// 担当の情報を入れる／直す。担当がいなければ入れた人が担当になる\nfunction saveSales(id, d) {\n  var me = myEmail_();\n  d = d || {};\n  var clean = function (v, n) { var s = String(v == null ? '' : v).trim().slice(0, n); return /^[=+\\-@]/.test(s) ? \"'\" + s : s; };\n  var month = String(d.month || '').trim();\n  if (month && !/^\\d{4}-(0[1-9]|1[0-2])$/.test(month)) throw new Error('掲載号の形が正しくありません');\n  var price = String(d.price == null ? '' : d.price).replace(/[,，円\\s]/g, '');\n  if (price && !/^\\d{1,9}$/.test(price)) throw new Error('掲載料金は数字で入れてください（税抜・円）');\n  return withLock_(function () {\n    var f = findRow_(id);\n    if (f.obj.deleted) throw new Error('削除された回答です');\n    var kv = { genre: clean(d.genre, 40), month: month, media: clean(d.media, 40), size: clean(d.size, 40), price: price, memo: clean(d.memo, 1000), updated: now_() };\n    if (!f.obj.ownerEmail) { kv.owner_email = me; kv.owner_name = nameOf_(me); kv.claimed_at = now_(); }\n    else if (!canEdit_(f.obj, me)) throw new Error('担当の ' + f.obj.ownerName + ' さんか管理者だけが直せます');\n    setCols_(f, kv);\n    return rowObj_(f.sh.getRange(f.row, 1, 1, RESP_HEAD.length).getValues()[0]);\n  });\n}\n// 一覧の表・詳細ページで1項目だけ直す（その場で保存・2026-11-19）。ほかの項目は触らないので、続けて直しても上書きし合わない\n// 担当がいなければ直した人が担当になる（saveSales と同じ）\nfunction saveField(id, key, value) {\n  var me = myEmail_(), lim = { genre: 40, media: 40, size: 40, memo: 1000, month: 0, price: 0 };\n  if (!(key in lim)) throw new Error('直せない項目です');\n  var v = String(value == null ? '' : value).trim();\n  if (key === 'month' && v && !/^\\d{4}-(0[1-9]|1[0-2])$/.test(v)) throw new Error('掲載号の形が正しくありません');\n  if (key === 'price') { v = v.replace(/[,，円\\s]/g, ''); if (v && !/^\\d{1,9}$/.test(v)) throw new Error('掲載料金は数字で入れてください（税抜・円）'); }\n  if (lim[key]) { v = v.slice(0, lim[key]); if (/^[=+\\-@]/.test(v)) v = \"'\" + v; }\n  return withLock_(function () {\n    var f = findRow_(id);\n    if (f.obj.deleted) throw new Error('削除された回答です');\n    var kv = { updated: now_() }; kv[key] = v;\n    if (!f.obj.ownerEmail) { kv.owner_email = me; kv.owner_name = nameOf_(me); kv.claimed_at = now_(); }\n    else if (!canEdit_(f.obj, me)) throw new Error('担当の ' + f.obj.ownerName + ' さんか管理者だけが直せます');\n    setCols_(f, kv);\n    return rowObj_(f.sh.getRange(f.row, 1, 1, RESP_HEAD.length).getValues()[0]);\n  });\n}\n// 削除（ゴミ箱。管理者が戻せる）／戻す（管理者）\nfunction removeRow(id) {\n  var me = myEmail_();\n  return withLock_(function () {\n    var f = findRow_(id);\n    if (!canEdit_(f.obj, me)) throw new Error('担当の人か管理者だけが削除できます');\n    setCols_(f, { deleted: now_(), deleted_by: me });\n    return { ok: true };\n  });\n}\nfunction restoreRow(id) {\n  var me = myEmail_(); if (!isAdmin_(me)) throw new Error('管理者だけができます');\n  return withLock_(function () { var f = findRow_(id); setCols_(f, { deleted: '', deleted_by: '', updated: now_() }); return rowObj_(f.sh.getRange(f.row, 1, 1, RESP_HEAD.length).getValues()[0]); });\n}\n// 候補（ジャンル・媒体・サイズ）を直す（管理者）\nfunction saveMaster(kind, list) {\n  var me = myEmail_(); if (!isAdmin_(me)) throw new Error('管理者だけができます');\n  if (!MASTERS[kind]) throw new Error('不明な候補です');\n  var vals = (list || []).map(function (s) { return String(s).trim().slice(0, 40); }).filter(String);\n  var seen = {}; vals = vals.filter(function (v) { if (seen[v]) return false; seen[v] = 1; return true; });\n  if (!vals.length) throw new Error('1つ以上入れてください');\n  return withLock_(function () {\n    var sh = ensureSheet_(kind, [kind]);\n    if (sh.getLastRow() > 1) sh.getRange(2, 1, sh.getLastRow() - 1, 1).clearContent();\n    sh.getRange(2, 1, vals.length, 1).setNumberFormat('@').setValues(vals.map(function (v) { return [v]; }));\n    return vals;\n  });\n}\n";

    if (f.month && r.month !== f.month) return false;
    if (f.folder === 'mine' && r.ownerEmail !== S.me.email) return false; if (f.folder === 'none' && r.ownerEmail) return false;
    if (f.folder && ['all', 'mine', 'none'].indexOf(f.folder) < 0 && r.ownerEmail !== f.folder) return false;
    if (f.sat && String(r.satHankyo) !== f.sat) return false; if (f.cost && String(r.satCost) !== f.cost) return false;
    return true;
  });
  $('main').innerHTML = '<div class="bar">'
    + '<input type="search" id="fQ" placeholder="掲載名・反響・要望で検索" value="' + esc(f.q) + '" style="min-width:220px">'
    + '<select id="fGenre">' + opts(S.masters.genres, f.genre, 'ジャンル') + '</select>'
    + '<select id="fMedia">' + opts(S.masters.media, f.media, '媒体') + '</select>'
    + '<select id="fMonth">' + monthOpts(months(), f.month, '掲載号') + '</select>'
    + '<select id="fSat"><option value="">反響満足度</option>' + [5, 4, 3, 2, 1].map(function (n) { return '<option value="' + n + '"' + (String(n) === f.sat ? ' selected' : '') + '>反響：' + LV[n] + '</option>'; }).join('') + '</select>'
    + '<select id="fCost"><option value="">費用感満足度</option>' + [5, 4, 3, 2, 1].map(function (n) { return '<option value="' + n + '"' + (String(n) === f.cost ? ' selected' : '') + '>費用感：' + LV[n] + '</option>'; }).join('') + '</select>'
    + (S.me.isAdmin ? '<label class="hint"><input type="checkbox" id="fDel"' + (f.showDel ? ' checked' : '') + '> 削除したものも</label>' : '')
    + '<span class="sp"></span>' + viewSeg() + '<span class="hint">' + rows.length + '件</span></div>'
    + cardsHtml(rows, S.rows.length ? '条件に合う回答はありません' : 'まだ回答はありません。「フォーム・設定」のURLやQRをクライアントに渡してください');
  var on = function (id, k, prop) { var el = $(id); if (!el) return; el.oninput = el.onchange = function () { S.f[k] = prop ? el[prop] : el.value; var pos = id === 'fQ' ? el.selectionStart : null; drawList(); if (pos != null) { var n = $('fQ'); n.focus(); n.setSelectionRange(pos, pos); } }; };
  on('fQ', 'q'); on('fGenre', 'genre'); on('fMedia', 'media'); on('fMonth', 'month'); on('fSat', 'sat'); on('fCost', 'cost'); on('fDel', 'showDel', 'checked');
}

// ---------- 分析 ----------
var BY = { genre: ['ジャンル', function (r) { return r.genre; }], media: ['媒体', function (r) { return r.media ? r.media + '版' : ''; }], size: ['掲載サイズ', function (r) { return r.size; }], owner: ['担当', function (r) { return r.ownerName; }], month: ['掲載号', function (r) { return fmtMonth(r.month); }], price: ['掲載料金', priceBand] };
function priceBand(r) { if (r.price === '' || r.price == null) return ''; var p = Number(r.price); return p < 20000 ? '2万円未満' : p < 50000 ? '2〜5万円' : p < 100000 ? '5〜10万円' : p < 200000 ? '10〜20万円' : '20万円以上'; }
var BAND_ORDER = ['2万円未満', '2〜5万円', '5〜10万円', '10〜20万円', '20万円以上'];
function avg(a) { return a.length ? a.reduce(function (s, x) { return s + x; }, 0) / a.length : 0; }
function distHtml(vals) { var n = vals.length || 1; return '<div class="dist" title="' + [5, 4, 3, 2, 1].map(function (k) { return LV[k] + ' ' + vals.filter(function (v) { return v === k; }).length; }).join(' / ') + '">' + [5, 4, 3, 2, 1].map(function (k) { var c = vals.filter(function (v) { return v === k; }).length; return c ? '<span style="width:' + (c / n * 100) + '%;background:' + COLORS[k] + '"></span>' : ''; }).join('') + '</div>'; }
function drawStats() {
  var st = S.st, ms = months();
  var rows = live().filter(function (r) { if (st.from && (!r.month || r.month < st.from)) return false; if (st.to && (!r.month || r.month > st.to)) return false; return true; });
  var h = rows.map(function (r) { return r.satHankyo; }).filter(Boolean), c = rows.map(function (r) { return r.satCost; }).filter(Boolean);
  var good = function (a) { return a.length ? Math.round(a.filter(function (v) { return v >= 4; }).length / a.length * 100) : 0; };
  var get = BY[st.by][1], groups = {};
  rows.forEach(function (r) { var k = get(r) || '（未入力）'; (groups[k] = groups[k] || []).push(r); });
  var keys = Object.keys(groups).sort(function (a, b) {
    if (a === '（未入力）') return 1; if (b === '（未入力）') return -1;
    if (st.by === 'price') return BAND_ORDER.indexOf(a) - BAND_ORDER.indexOf(b);
    if (st.by === 'month') return a < b ? 1 : -1;
    return groups[b].length - groups[a].length;
  });
  var tbl = '<div class="tblw"><table class="st"><tr><th>' + BY[st.by][0] + '</th><th>件数</th><th>反響満足度（平均）</th><th>反響の内訳</th><th>費用感満足度（平均）</th><th>費用感の内訳</th></tr>'
    + keys.map(function (k) { var g = groups[k], hh = g.map(function (r) { return r.satHankyo; }).filter(Boolean), cc = g.map(function (r) { return r.satCost; }).filter(Boolean);
      return '<tr><td>' + esc(k) + '</td><td class="n">' + g.length + '</td><td class="n">' + (hh.length ? avg(hh).toFixed(1) : '—') + '</td><td>' + distHtml(hh) + '</td><td class="n">' + (cc.length ? avg(cc).toFixed(1) : '—') + '</td><td>' + distHtml(cc) + '</td></tr>'; }).join('') + '</table></div>';
  $('main').innerHTML = '<div class="bar"><span>掲載号</span><select id="sFrom">' + monthOpts(ms.slice().reverse(), st.from, 'はじめから') + '</select><span>〜</span><select id="sTo">' + monthOpts(ms, st.to, '最新まで') + '</select>'
    + '<span class="sp"></span><span class="hint">満足度は 満足=5 ・やや満足=4 ・どちらともいえない=3 ・やや不満=2 ・不満=1 の平均</span></div>'
    + '<div class="kpis"><div class="kpi"><div class="l"><i style="background:#6366f1"></i>回答数</div><div class="v">' + rows.length + '<small>件</small></div></div>'
    + '<div class="kpi"><div class="l"><i style="background:#16a34a"></i>反響満足度の平均</div><div class="v">' + (h.length ? avg(h).toFixed(1) : '—') + '<small>/ 5</small></div><div class="hint">満足・やや満足 ' + good(h) + '%</div></div>'
    + '<div class="kpi"><div class="l"><i style="background:#2563eb"></i>費用感満足度の平均</div><div class="v">' + (c.length ? avg(c).toFixed(1) : '—') + '<small>/ 5</small></div><div class="hint">満足・やや満足 ' + good(c) + '%</div></div>'
    + '<div class="kpi"><div class="l"><i style="background:#f59e0b"></i>担当が決まっていない回答</div><div class="v">' + rows.filter(function (r) { return !r.ownerEmail; }).length + '<small>件</small></div></div></div>'
    + '<div class="bar"><span class="hint">くらべる切り口</span><div class="seg">' + Object.keys(BY).map(function (k) { return '<button class="' + (k === st.by ? 'on' : '') + '" data-by="' + k + '">' + BY[k][0] + '別</button>'; }).join('') + '</div></div>'
    + '<div class="legend">' + [5, 4, 3, 2, 1].map(function (k) { return '<span><i style="background:' + COLORS[k] + '"></i>' + LV[k] + '</span>'; }).join('') + '</div>'
    + (rows.length ? tbl : '<div class="empty">まだ回答はありません</div>');
  $('sFrom').onchange = function () { S.st.from = this.value; drawStats(); }; $('sTo').onchange = function () { S.st.to = this.value; drawStats(); };
  [].forEach.call(document.querySelectorAll('[data-by]'), function (b) { b.onclick = function () { S.st.by = b.dataset.by; drawStats(); }; });
}

// ---------- 事例 ----------
function drawCases() {
  var cs = S.cs;
  var rows = live().filter(function (r) { return r.satHankyo >= 4 && r.hankyo && (!cs.genre || r.genre === cs.genre) && (!cs.media || r.media === cs.media); })
    .sort(function (a, b) { return b.satHankyo - a.satHankyo || (a.at < b.at ? 1 : -1); });
  $('main').innerHTML = '<div class="bar"><span class="hint">反響が「満足」「やや満足」で、具体的な反響が書かれている回答です。営業トークや提案資料にどうぞ。</span><span class="sp"></span>' + viewSeg()
    + '<select id="cGenre">' + opts(S.masters.genres, cs.genre, 'ジャンル') + '</select><select id="cMedia">' + opts(S.masters.media, cs.media, '媒体') + '</select><span class="hint">' + rows.length + '件</span></div>'
    + cardsHtml(rows, 'まだ事例になる回答はありません');
  $('cGenre').onchange = function () { S.cs.genre = this.value; drawCases(); }; $('cMedia').onchange = function () { S.cs.media = this.value; drawCases(); };
}

// ---------- フォーム・設定 ----------
function drawSettings() {
  var m = S.masters, ad = S.me.isAdmin;
  var mf = S.myForm, dp = S.defaultPh || {};
  $('main').innerHTML = '<h2 class="sec" style="margin-top:0">クライアントに渡すアンケート（2種類）</h2>'
    + '<div class="fcard"><h3>あなた専用のアンケート<span class="tagx mine">おすすめ</span></h3><div class="hint" style="margin-bottom:10px">このURL・QRから届いた回答は、最初から<b>あなたの担当</b>になります（「自分の担当にする」は要りません）。②④⑤のグレーの参考文も、あなた用に変えられます。</div>'
    + (mf ? '<div class="formbox"><div class="qrbox" id="qrMine"></div><div style="flex:1;min-width:240px"><div class="url"><a href="' + esc(mf.url) + '" target="_blank">' + esc(mf.url) + '</a></div>'
        + '<div class="acts" style="margin-top:8px"><button class="btn sm" data-copy="' + esc(mf.url) + '">URLをコピー</button><button class="btn sm" data-dl="qrMine" data-name="反響アンケートQR_' + esc(S.me.name) + '.png">QRを画像で保存</button></div></div></div>'
        + '<div class="phed" style="margin-top:14px"><div class="hint">参考文（空にすると共通の参考文になります）</div>'
        + [['hankyo', '② 具体的な反響'], ['riyu', '④ 費用感の理由'], ['youbou', '⑤ ご要望']].map(function (k) { return '<div class="fld"><label>' + k[1] + '</label><textarea id="ph_' + k[0] + '" maxlength="200" placeholder="' + esc(dp[k[0]] || '') + '">' + esc(mf.ph[k[0]] || '') + '</textarea></div>'; }).join('')
        + '<div class="acts" style="margin-top:10px"><button class="btn sm primary" id="phSave">参考文を保存</button><a class="btn sm" href="' + esc(mf.url) + '" target="_blank">お客様の画面を見る</a></div></div>'
      : '<button class="btn primary" id="mkForm">自分専用のアンケートを作る</button>')
    + '</div>'
    + '<div class="fcard"><h3>共通のアンケート<span class="tagx common">全社共通</span></h3><div class="hint" style="margin-bottom:10px">だれのお客さんでも使えます。届いた回答は「未割り当て」に出るので、担当が「自分の担当にする」を押します。</div>'
    + '<div class="formbox"><div class="qrbox" id="qrCommon"></div><div style="flex:1;min-width:240px"><div class="url"><a href="' + esc(S.formUrl) + '" target="_blank">' + esc(S.formUrl) + '</a></div>'
    + '<div class="acts" style="margin-top:8px"><button class="btn sm" data-copy="' + esc(S.formUrl) + '">URLをコピー</button><button class="btn sm" data-dl="qrCommon" data-name="反響アンケートQR_共通.png">QRを画像で保存</button></div></div></div></div>'
    + (ad ? '<h2 class="sec">候補（管理者だけが直せます・1行に1つ）</h2><div class="cards">'
      + [['genres', 'ジャンル'], ['media', '媒体'], ['sizes', '掲載サイズ・枠']].map(function (k) { return '<div class="rc"><b>' + k[1] + '</b><textarea id="m_' + k[0] + '" rows="8" style="width:100%;font:inherit;border:1px solid #ccc;border-radius:6px;padding:6px">' + esc((m[k[0]] || []).join('\n')) + '</textarea><div class="acts"><button class="btn sm" data-m="' + k[0] + '">保存する</button></div></div>'; }).join('')
      + '</div>' + (S.sheetUrl ? '<p class="hint">データのスプレッドシート：<a href="' + esc(S.sheetUrl) + '" target="_blank">反響事例管理データ</a>（管理者の追加は admins シートに1行）</p>' : '') : '<p class="hint">ジャンル・媒体・サイズの候補を増やしたいときは管理者に頼んでください。</p>');
  var qr = function (id, text) { try { new QRCode($(id), { text: text, width: 220, height: 220, correctLevel: QRCode.CorrectLevel.M }); } catch (x) { $(id).textContent = 'QRを作れませんでした'; } };
  qr('qrCommon', S.formUrl); if (mf) qr('qrMine', mf.url);
  [].forEach.call(document.querySelectorAll('[data-copy]'), function (b) { b.onclick = function () { var u = b.dataset.copy; (navigator.clipboard ? navigator.clipboard.writeText(u) : Promise.reject()).then(function () { toast('URLをコピーしました'); }).catch(function () { prompt('コピーしてください', u); }); }; });
  [].forEach.call(document.querySelectorAll('[data-dl]'), function (b) { b.onclick = function () { var box = $(b.dataset.dl), c = box.querySelector('canvas'), img = box.querySelector('img'); var src = c ? c.toDataURL('image/png') : img && img.src; if (!src) return; var a = document.createElement('a'); a.href = src; a.download = b.dataset.name; a.click(); }; });
  if ($('mkForm')) $('mkForm').onclick = function () { this.disabled = true; run('createMyForm').then(function (f) { S.myForm = f; toast('自分専用のアンケートを作りました'); drawSettings(); }).catch(function (e) { toast(e.message); drawSettings(); }); };
  if ($('phSave')) $('phSave').onclick = function () { var b = this; b.disabled = true; run('saveMyForm', { hankyo: $('ph_hankyo').value, riyu: $('ph_riyu').value, youbou: $('ph_youbou').value }).then(function (f) { S.myForm = f; b.disabled = false; toast('参考文を保存しました（お客様の画面に出ます）'); }).catch(function (e) { b.disabled = false; toast(e.message); }); };
  [].forEach.call(document.querySelectorAll('[data-m]'), function (b) { b.onclick = function () { var k = b.dataset.m; b.disabled = true; run('saveMaster', k, $('m_' + k).value.split('\n')).then(function (v) { S.masters[k] = v; b.disabled = false; toast('保存しました'); drawSettings(); }).catch(function (e) { b.disabled = false; toast(e.message); }); }; });
}

// ---------- 担当の情報 ----------
function openEdit(id) {
  var r = S.rows.find(function (x) { return x.id === id; }); if (!r) return;
  S.editId = id;
  $('dTitle').textContent = r.keisai;
  $('dSub').textContent = r.at + ' の回答' + (r.ownerEmail ? '・担当 ' + r.ownerName : '・保存するとあなたが担当になります');
  var sel = function (el, list, cur) { var l = list.slice(); if (cur && l.indexOf(cur) < 0) l.push(cur); el.innerHTML = '<option value="">（選ぶ）</option>' + l.map(function (v) { return '<option' + (v === cur ? ' selected' : '') + '>' + esc(v) + '</option>'; }).join(''); };
  sel($('dGenre'), S.masters.genres, r.genre); sel($('dMedia'), S.masters.media, r.media); sel($('dSize'), S.masters.sizes, r.size);
  $('dMonth').innerHTML = issueOpts(r.month || '');
  // 担当: 本人か管理者は誰にでも付け替えられる。担当なしなら自分（管理者は誰でも）
  var canAll = S.me.isAdmin || r.ownerEmail === S.me.email, cur = r.ownerEmail || S.me.email;
  var ppl = canAll ? S.people.slice() : S.people.filter(function (p) { return p.email === S.me.email; });
  if (!ppl.some(function (p) { return p.email === cur; })) ppl.unshift({ email: cur, name: r.ownerName || S.me.name });
  $('dOwner').innerHTML = ppl.map(function (p) { return '<option value="' + esc(p.email) + '"' + (p.email === cur ? ' selected' : '') + '>' + esc(p.name) + (p.email === S.me.email ? '（自分）' : '') + '</option>'; }).join('');
  $('dOwner').disabled = !canAll && !!r.ownerEmail; $('dPrice').value = r.price === '' ? '' : r.price; $('dMemo').value = r.memo || '';
  $('dMsg').textContent = ''; $('dMsg').className = 'msg'; $('dSave').disabled = false;
  $('dlg').showModal();
}
$('dCancel').onclick = function () { $('dlg').close(); };
$('dSave').onclick = function () {
  var b = this; b.disabled = true; $('dMsg').textContent = '保存しています…'; $('dMsg').className = 'msg';
  var r0 = S.rows.find(function (x) { return x.id === S.editId; }), to = $('dOwner').value;
  (to && to !== (r0.ownerEmail || '') && (r0.ownerEmail || to !== S.me.email) ? run('assign', S.editId, to) : Promise.resolve()).then(function () { return run('saveSales', S.editId, { genre: $('dGenre').value, month: $('dMonth').value, media: $('dMedia').value, size: $('dSize').value, price: $('dPrice').value, memo: $('dMemo').value }); })
    .then(function (r) { upsert(r); $('dlg').close(); toast('保存しました'); draw(); })
    .catch(function (e) { b.disabled = false; $('dMsg').textContent = e.message; $('dMsg').className = 'msg err'; });
};
// 使い方ガイド: 中身ができたら GUIDE_URL に入れる（2026-11-19 ボタンだけ先に）
var GUIDE_URL = '';
$('guideBtn').onclick = function (e) { if (GUIDE_URL) { this.href = GUIDE_URL; this.target = '_blank'; return; } e.preventDefault(); toast('使い方ガイドは準備中です'); };
</script>
</body>
